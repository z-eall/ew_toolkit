- name: isBfvPowerstoneWolf
  ints:
  - Piece.m_canBeRemoved, 0
  - isBfvPowerstone, 1
  - Piece.m_isUpgrade, 0
  - Piece.m_comfort, <comfortPowerstone>
  - Piece.m_primaryTarget, 0
  - Piece.m_randomTarget, 0
