# ═══════════════════════════════════════════════════════════
# FOR ALTARS
# ═══════════════════════════════════════════════════════════
- name: unlockBossAltar
  ints:
  - OfferingBowl.m_useItemStands, <unlockBossItemstand_<nameBoss_<int_location=0>>>
  strings:
  - OfferingBowl.m_bossItem, <unlockBossItem_<nameBoss_<int_location=0>>>
  - OfferingBowl.m_wrongOfferText, Nothing happens

- name: lockBossAltar
  ints:
  - OfferingBowl.m_useItemStands, 0
  strings:
  - OfferingBowl.m_bossItem, <lockBossItem>
  - OfferingBowl.m_wrongOfferText, <lockBossMessage>

# ═══════════════════════════════════════════════════════════
# FOR DOORS
# ═══════════════════════════════════════════════════════════
- name: unlockBossDoor
  strings:
  - Door.m_keyItem, <unlockBossItem_<nameBoss_<prefab>>>
  - Door.m_name, <unlockBossDoorName_<nameBoss_<prefab>>>

- name: lockBossDoor
  strings:
  - Door.m_keyItem, <lockBossItem>
  - Door.m_name, <lockBossDoorName>