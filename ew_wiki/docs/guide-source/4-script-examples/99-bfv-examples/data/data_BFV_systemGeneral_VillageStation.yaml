# Seal Crate - Stations
- name: isBfvVillageStationSeal
  ints:
  - isBfvVillageStationSeal, 1
  - StaticPhysics.m_pushUp, 0
  - StaticPhysics.m_fall, 0
  - WearNTear.m_noSupportWear, 0
  - WearNTear.m_burnable, 0
  - WearNTear.m_minToolTier, 999
  - Piece.m_canBeRemoved, 0
  floats:
  - WearNTear.m_health, -1
  - health, -1
  - DropOnDestroyed.m_spawnYOffset, 15000
  - Piece.m_returnResourceHeightOffset, 15000
  strings:
  - HoverText.m_text, Sealed <#fff000><displayName_<prefab>></color><br>Unseal upon World Level <#00ffff><requiredWorldLevel_<prefab>></color>
  - sealedPrefab, <prefab>

