# Master Spawner Data
# ═══════════════════════════════════════════════════════════

- name: injectLockedZdo
  ints:
  - hasLockedZdo, 1
  strings:
  - spawnerZDO, <par_1>

# ═══════════════════════════════════════════════════════════
# Banegard Dvergers
# ═══════════════════════════════════════════════════════════
# Tamed Dverger
- name: BG_DvergerTamed
  ints:
  - BG_DvergerTamed, 1
  - aggravated, 0
  - Humanoid.m_tamed, 1
  - MonsterAI.m_aggravatable, 0
  - MonsterAI.m_attackPlayerObjects, 0
  floats:
  - Humanoid.m_health, 1e17
  - max_health, 1e17
  - NpcTalk.m_maxRange, 0
  - Humanoid.m_runSpeed, 2
  - Humanoid.m_walkSpeed, 2
  strings:
  - Humanoid.m_name, "Banegard Dverger"
  
# Hostile Dverger - Rogue
- name: BG_DvergerHostileRogue
  ints:
  - BG_DvergerHostileRogue, 1
  - Humanoid.m_staggerWhenBlocked, 0
  - aggravated, 1
  - level, 2
  - Humanoid.m_tamed, 0
  - MonsterAI.m_aggravatable, 1
  - MonsterAI.m_attackPlayerObjects, 0
  floats:
  - Humanoid.m_health, 800
  - max_health, 800
  - NpcTalk.m_maxRange, 0
  - Humanoid.m_runSpeed, 3
  - Humanoid.m_walkSpeed, 3
  strings:
  - Humanoid.m_name, "Banegard Dverger"
  
# Hostile Dverger - Mage
- name: BG_DvergerHostileMage
  ints:
  - BG_DvergerHostileMage, 1
  - aggravated, 1
  - Humanoid.m_tamed, 0
  - MonsterAI.m_aggravatable, 1
  - MonsterAI.m_attackPlayerObjects, 0
  floats:
  - Humanoid.m_health, 600
  - max_health, 600
  - NpcTalk.m_maxRange, 0
  strings:
  - Humanoid.m_name, "Banegard Dverger"
  
# Hostile Dverger - Ironbeard Boss
- name: BG_DvergerHostileBoss
  ints:
  - BG_DvergerHostileBoss, 1
  - aggravated, 1
  - Humanoid.m_tamed, 0
  - Humanoid.m_boss, 1
  - MonsterAI.m_aggravatable, 1
  - Humanoid.m_staggerWhenBlocked, 0
  - MonsterAI.m_attackPlayerObjects, 0
  floats:
  - Humanoid.m_health, 4800
  - max_health, 4500
  - NpcTalk.m_maxRange, 0
  - RandomSkillFactor, 1.3
  strings:
  - Humanoid.m_name, "Ironbeard"
  - MonsterAI.m_deathMessage, "<color=orange>Ironbeard is dead, and the shield of Banegard has vanished." 
  hashes:
  - HelmetItem, DvergerHairMale
  
