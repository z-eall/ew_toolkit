# Felgar Hold
# ═══════════════════════════════════════════════════════════
## Felgar Surtling

# Spawner
- name: surtlingfelgar_spawner
  ints:
  - CreatureSpawner.m_spawnInPlayerBase, 1
  - surtlingfelgar_spawner, 1
  floats:
  - CreatureSpawner.m_triggerDistance, 100
  - CreatureSpawner.m_respawnTimeMinuts, 1
  - CreatureSpawner.m_maxGroupSpawned, 1
  strings:
  - CreatureSpawner.m_creaturePrefab, sfx_secretfound
  
# Creature
- name: surtling_felgar
  ints:
  - surtling_felgar, 1
  - MonsterAI.m_attackPlayerObjects, 0
  - level, 4
  - Humanoid.m_flying, 1
  - MonsterAI.m_circulateWhileChargingFlying, 1
  - MonsterAI.m_viewAngle, 360
  - MonsterAI.m_viewRange, 100
  - MonsterAI.m_alertRange, 100
  floats:
  - Humanoid.m_flySlowSpeed, 5
  - Humanoid.m_flyFastSpeed, 5
  - Humanoid.m_flyTurnSpeed, 300
  - RandomSkillFactor, 1.8
  strings:
  - Humanoid.m_name, "Firewraith"
  - spawnerZDO, <string_spawnerZDO=0>

