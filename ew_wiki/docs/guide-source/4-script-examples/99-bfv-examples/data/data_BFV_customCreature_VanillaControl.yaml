- value: rangeBossDropPerPlayer, 30

# ═══════════════════════════════════════════════════════════
# Value data
# ═══════════════════════════════════════════════════════════
# Boss Trophies
- value: trophy_eikthyr-ragdoll, TrophyEikthyr
- value: trophy_gdking-Ragdoll, TrophyTheElder
- value: trophy_Bonemass, TrophyBonemass
- value: trophy_Dragon, TrophyDragonQueen
- value: trophy_GoblinKing-ragdoll, TrophyGoblinKing
- value: trophy_SeekerQueen, TrophySeekerQueen
- value: trophy_fx-Fader-Ragdoll, TrophyFader

# Boss drops
- value: bossDrop_eikthyr-ragdoll, HardAntler
- value: bossDrop_gdking-Ragdoll, CryptKey
- value: bossDrop_Bonemass, Wishbone
- value: bossDrop_Dragon, DragonTear
- value: bossDrop_GoblinKing-ragdoll, YagluthDrop
- value: bossDrop_SeekerQueen, QueenDrop
- value: bossDrop_fx-Fader-Ragdoll, FaderDrop

# Effects poof for ragdolls
- value: effect_eikthyr-ragdoll, vfx_corpse_destruction_large
- value: effect_gdking-Ragdoll, vfx_corpse_destruction_large
- value: effect_GoblinKing-ragdoll, vfx_corpse_destruction_large
- value: effect_fx-Fader-Ragdoll, fx_Fader_CorpseExplosion

# Character Drop offset at Y 1500 
- name: isCharacterDropY1500
  vecs:
  - CharacterDrop.m_spawnOffset, 0,0,15000

