# ELDEROOT MINE - BOSS - ELDEN KING
# ═══════════════════════════════════════════════════════════
# Creature
- name: eldenking
  ints:
  - eldenking, 1
  - Humanoid.m_boss, 1
  floats:
  - Humanoid.m_health, 20000
  - max_health, 20000
  - RandomSkillFactor, 4
  strings:
  - MonsterAI.m_alertedMessage, "<color=orange>Nature is calling... return to the source, norsemen..."
  - MonsterAI.m_deathMessage, "<color=orange>The Elden King returned to the source..." 
  - Humanoid.m_name, "Elden King"
  - spawnerZDO, <string_spawnerZDO=0>

# Loot drop  
- name: loot_eldenking
  position: 4251,-2618,4361.5
  rotation: 90,0,0
  ints:
  - Container.m_autoDestroyEmpty, 1
  - Piece.m_canBeRemoved, 0
  - loot_eldenking, 1
  floats:
  - health, -1
  - WearNTear.m_health, -1
  strings:
  - Container.m_name, "Elden King's Chest"
  items:
  - prefab: Coins
    stack: 200;400
    chance: 1
  - prefab: Hearthstone
    chance: 0.5
    stack: 1;3
  - prefab: SledgeElder
    chance: 1
    stack: 1
  - prefab: BombBile
    chance: 0.5
    stack: 5;10
  - prefab: ArmorRootChest
    chance: 1
    quality: 4
    durability: 1100
    stack: 1
  - prefab: MeadHealthLingering
    chance: 0.5
    stack: 1;3
  - prefab: MeadStaminaLingering
    chance: 0.5
    stack: 1;3
  - prefab: TrinketIronStamina
    chance: 0.2
    stack: 1
  - prefab: TrinketBronzeStamina
    chance: 0.2
    stack: 1

