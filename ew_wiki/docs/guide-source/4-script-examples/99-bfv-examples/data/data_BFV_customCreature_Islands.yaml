# ISLANDS - WILDBOAR
# ═══════════════════════════════════════════════════════════
# Spawner
- name: wildboar_spawner
  ints:
  - CreatureSpawner.m_spawnInPlayerBase, 1
  - wildboar_spawner, 1
  floats:
  - CreatureSpawner.m_triggerDistance, 20
  - CreatureSpawner.m_respawnTimeMinuts, 20
  - CreatureSpawner.m_maxGroupSpawned, 1
  strings:
  - CreatureSpawner.m_creaturePrefab, sfx_secretfound

# Creature
- name: wildboar
  ints:
  - wildboar, 1
  - level, 4
  - MonsterAI.m_circulateWhileCharging, 0
  - MonsterAI.m_fleeIfHurtWhenTargetCantBeReached, 1
  - MonsterAI.m_afraidOfFire, 0
