  - MonsterAI.m_jumpInterval, 3
  - MonsterAI.m_circleTargetInterval, 3
  - MonsterAI.m_circleTargetDistance, 6
  - MonsterAI.m_circleTargetDuration, 2
  - Humanoid.m_jumpForce, 4
  - Humanoid.m_jumpForceForward, 11
  - Humanoid.m_runTurnSpeed, 400
  - Humanoid.m_flyTurnSpeed, 400
  - Humanoid.m_health, 200
  - max_health, 200
  - RandomSkillFactor, 5
  strings:
  - Humanoid.m_name, "Wildboar"
  - spawnerZDO, <string_spawnerZDO=0>

- name: wildboar_tame
  ints:
  - wildboar, 1
  - wildboar_tame, 1
  - tamed, 1
  - level, 4
  - MonsterAI.m_circulateWhileCharging, 0
  - MonsterAI.m_fleeIfHurtWhenTargetCantBeReached, 1
  - MonsterAI.m_afraidOfFire, 0
  floats:
  - MonsterAI.m_jumpInterval, 3
  - MonsterAI.m_circleTargetInterval, 3
  - MonsterAI.m_circleTargetDistance, 6
  - MonsterAI.m_circleTargetDuration, 2
  - Humanoid.m_jumpForce, 4
  - Humanoid.m_jumpForceForward, 11
  - Humanoid.m_runTurnSpeed, 400
  - Humanoid.m_flyTurnSpeed, 400
  - Humanoid.m_health, 10
  - max_health, 10
  - RandomSkillFactor, 5
  strings:
  - Humanoid.m_name, "Wildboar"
  - spawnerZDO, <string_spawnerZDO=0>

- name: wildboar_piggy
  ints:
  - wildboar_piggy, 1
  - tamed, 1
  - level, 4
  floats:
  - max_health, 10
  - Humanoid.m_jumpForce, 4
  - Humanoid.m_jumpForceForward, 11
  - Humanoid.m_runTurnSpeed, 400
  - Humanoid.m_flyTurnSpeed, 400
  - AnimalAI.m_jumpInterval, 3
  - Growup.m_growTime, 1e30
  strings:
  - Humanoid.m_name, "Wildboar Piggy"

- value: growUpTime_wildboar, 3000


