# ║ Section - Tweak Catapult                                  ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
# CATAPULT
- name: catadata
  ints:
  - Aoe.m_hitCharacters, 0
  - Catapult.m_maxLoadStack, 7
  floats:
  - Catapult.m_shootVelocityVariation, 0.35
  - Catapult.m_launchForce, 0.1
  
# CATAPULT SILVER
- name: catasilverdata
  ints:
  - Aoe.m_hitCharacters, 0
  - Catapult.m_maxLoadStack, 10
  floats:
  - Catapult.m_shootVelocityVariation, 1.05
  - Catapult.m_launchForce, 0.1
  
# CATAPULT IRON
- name: catairondata
  ints:
  - Aoe.m_hitCharacters, 0
  - Catapult.m_maxLoadStack, 4
  floats:
  - Catapult.m_shootVelocityVariation, 0.21
  - Catapult.m_launchForce, 0.1

