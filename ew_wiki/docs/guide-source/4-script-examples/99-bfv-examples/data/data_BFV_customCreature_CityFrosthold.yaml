# FROSTHOLD - ICEBLOOD REVENANT
# ═══════════════════════════════════════════════════════════
# Spawner
- name: icebloodrevenant_spawner
  ints:
  - isBfvCreatureSpawner, 1
  - CreatureSpawner.m_spawnInPlayerBase, 1
  - CreatureSpawner.m_spawnInterval, 1
  floats:
  - CreatureSpawner.m_respawnTimeMinuts, 3
  - CreatureSpawner.m_triggerDistance, 35
  strings:
  - isSpawningPrefab, Ghost
  - isSpawningPrefabData, icebloodrevenant
  - CreatureSpawner.m_creaturePrefab, sfx_secretfound

# Creature
- name: icebloodrevenant
  ints:
  - Humanoid.m_staggerWhenBlocked, 0
  - Humanoid.m_flying, 1
  floats:
  - health, 90
  - max_health, 90
  - Humanoid.m_health, 90
  - Humanoid.m_regenAllHPTime, 6
  - Humanoid.m_flyFastSpeed, 7
  - Humanoid.m_flyTurnSpeed, 700
  - Humanoid.m_flySlowSpeed, 1
  - MonsterAI.m_viewAngle, 30
  - MonsterAI.m_viewRange, 40
  - MonsterAI.m_circleTargetDistance, 5
  - MonsterAI.m_circleTargetDuration, 3
  - MonsterAI.m_circleTargetInterval, 4
  - MonsterAI.m_flyAltitudeMin, 1
  - MonsterAI.m_flyAltitudeMax, 3
  - RandomSkillFactor, 4
  strings:
  - Humanoid.m_name, "Iceblood Revenant"
  - spawnerZDO, <string_spawnerZDO=0>
  vecs:
  - CharacterDrop.m_spawnOffset, 0,0,15000

