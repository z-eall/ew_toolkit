# ═══════════════════════════════════════════════════════════
# ISLANDS - WILDBOAR
# ═══════════════════════════════════════════════════════════
# # Spawn from spawner
# - prefab: sfx_secretfound
  # type: create
  # objects:
  # - prefab: Spawner_Bat
    # filter: int, wildboar_spawner, 1
    # maxDistance: 1
  # bannedObjects:
  # - prefab: Boar
    # maxDistance: 1
  # swap:
  # - prefab: Boar
    # data: wildboar
    # triggerRules: true
  # spawn:
  # - prefab: vfx_Place_chest

# Loot drop
- prefab: boar_ragdoll
  type: create
  objects:
  - prefab: Spawner_Bat
    filter: string, isSpawningPrefabData, wildboar
    maxDistance: 50
  - prefab: Boar
    filters:
    - int, wildboar, 1
    - int, wildboarbreeder, 1
    maxDistance: 11
    maxHeight: 20
  objectsLimit: 1
  remove: true
  removeDelay: <add_-1_<float_Ragdoll.m_ttl=3>>
  spawn:
  - prefab: vfx_corpse_destruction_medium
    delay: <add_-1_<float_Ragdoll.m_ttl=3>>
  - prefab: WildboarMeat
    data: int, stack, 1;3
    delay: <add_-1_<float_Ragdoll.m_ttl=3>>

# Tame
- prefab: Boar
  type: change, tamed 1
  filter: int, wildboar, 1
  bannedFilter: int, wildboar_tame, 1
  data: wildboar_tame
  injectData: false
  triggerRules: false

# Pregnancy
- prefab: vfx_boar_love
  type: create
  objects:
  - prefab: Boar
    filter: int, wildboar, 1
    bannedFilter: int, wildboarbreeder, 1
    maxDistance: 1.1
  poke:
  - prefab: Boar
    filter: int, wildboar, 1
    bannedFilter: int, wildboarbreeder, 1
    limit: 1
    maxDistance: 1.1
    parameter: injectWildboarBreeder

# Inject custom breeder data
- prefab: Boar
  type: poke, injectWildboarBreeder
  data: int, wildboarbreeder, 1

# Apply custom offspring data
- prefab: Boar_piggy
  type: create
  objects:
  - prefab: Boar
    filters:
    - int, wildboar, 1
    - int, wildboarbreeder, 1
    maxDistance: 1.1
  data: wildboar_piggy

- prefab: sfx_boar_idle
  type: create
  objects:
  - prefab: Boar
    filters:
    - int, wildboar, 1
    - int, wildboarbreeder, 1
    maxDistance: 1.1
  bannedObjects:
  - prefab: sfx_boar_idle
    maxDistance: 5
  poke:
  - prefab: Boar_piggy
    filter: int, wildboar_piggy, 1
    maxDistance: 11
    maxHeight: 20
    parameter: checkWildboarGrowup

# Detect custom offspring grow up
- prefab: Boar_piggy
  type: poke, checkWildboarGrowup
  # commands:
  # - s LWT is <long_lastWorldTime=0>
  # - s spawntime is <long_spawntime=0>
  # - s sublong is <sublong_<long_lastWorldTime=0>_<long_spawntime=0>>
  # - s growtime is <mullong_10000000_<growUpTime_wildboar>>
  # - s sub is <sublong_<mullong_10000000_<growUpTime_wildboar>>_20000000>>
  # - s <ge_<sublong_<long_lastWorldTime=0>_<long_spawntime=0>>_<sublong_<mullong_10000000_<growUpTime_wildboar>>_20000000>>
  spawn:
  - prefab: vfx_creature_soothed
  poke:
  - self: true
    parameter: checkGrowTime <ge_<sublong_<long_lastWorldTime=0>_<long_spawntime=0>>_<sublong_<mullong_10000000_<growUpTime_wildboar>>_20000000>>

# Swap grow up prefab
- prefab: Boar_piggy
  type: poke, checkGrowTime true
  remove: true
  spawn:
  - prefab: Boar
    data: wildboar

