#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - City Radar                                      ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
- prefab: Player
  type: state, resetcloth
  keys: <pid>/team
  bannedFilter: int, $crouching, 1
  objects:
  - prefab: AshlandsTreeStump2
    filter: int, isRadarCity, 1;99
    bannedFilter: int, isCapturedByTeam, <load_<pid>/team=0>
    maxDistance: <radarDistance<shortnameCity<int_isRadarCity=0>>>
  poke:
  - prefab: AshlandsTreeStump2
    filters:
    - int, isRadarCity, 1;99
    - int, isCapturedByTeam, 1;2
    limit: 1
    maxDistance: 50
    parameter: triggerCityRadar <pid> <cid>

- prefab: AshlandsTreeStump2
  type: poke, triggerCityRadar
  bannedKeys: radarblockercity<int_isRadarCity=0> 1
  # commands: # debug
  # - s time is <time>
  # - s player cd is <load_<par_1>/radarcooldown=0>
  # - s radar cd duration is <radarCooldown>
  # - s sub is <sub_<time>_<load_<par_1>/radarcooldown=0>>
  # - s sublong is <sublong_<time>_<load_<par_1>/radarcooldown=0>>
  # - s check  is <ge_<sub_<time>_<load_<par_1>/radarcooldown=0>>_<radarCooldown>>
  # - s check floor is <ge_<floor_<sub_<time>_<load_<par_1>/radarcooldown=0>>>_<radarCooldown>>
  poke:
  - self: true
    parameter: calculateRadarCD <ge_<floor_<sub_<time>_<load_<par_1>/radarcooldown=0>>>_<radarCooldown>> <par_1> <par_2> # radarCD, playerPID, playerCID

- prefab: AshlandsTreeStump2
  type: poke, calculateRadarCD true
  exec: |
    <save_<par_2>/radarcooldown_<time>>
  poke:
  - self: true
    parameter: printPlayerDetection true <par_2> <par_3> # radarCD, playerPID, playerCID
  - prefab: nonSiegeStation
    bannedFilter: float, CraftingStation.m_rangeBuild, -999;0
    maxDistance: <radarDistance<shortnameCity<int_isRadarCity=0>>>
    parameter: shrinkRangeBuild

- prefab: nonSiegeStation
  type: poke, shrinkRangeBuild
  data: float, CraftingStation.m_rangeBuild, -200
  injectData: false

- prefab: AshlandsTreeStump2
  type: poke, printPlayerDetection
  bannedKeys: raidtime/<shortnameCity<int_isRadarCity=0>>
  commands:
  - wait 000;s ⚠️ <BfvTeam<load_<par_2>/team=0>> detected at <upper_<nameCity<int_isRadarCity=0>>>! Build and Repair disabled!
  # - broadcast center <#ddd><color<BfvTeam<load_<par_2>/team=0>>><BfvTeam<load_<par_2>/team=0>></color> detected at <color<BfvTeam<int_isCapturedByTeam=-1>>><upper_<nameCity<int_isRadarCity=0>>></color>!<br>Build and Repair disabled at <color<BfvTeam<int_isCapturedByTeam=-1>>><upper_<nameCity<int_isRadarCity=0>>></color>!


# Powerstone healer send this poke
# Check if raid over
- prefab: AshlandsTreeStump2
  type: poke, checkIfEnemyPresent # This comes from systemPowerstone
  commands:
  # - wait 100;s Raid status for <upper_<nameCity<int_isRadarCity=0>>> has expired. Build and Repair restored.
  - wait 100;s <msgSiegeRelease<int_isCapturedByTeam=0>>
  # - wait 100;broadcast center <#ddd>Build and Repair restored at <color<BfvTeam<int_isCapturedByTeam=-1>><upper_<nameCity<int_isRadarCity=0>>></color>!
  # bannedKeys: raidinprogress/<shortnameCity<int_isRadarCity=0>>
  objects:
  - prefab: nonSiegeStation
    filter: float, CraftingStation.m_rangeBuild, -999;0
    maxDistance: <radarDistance<shortnameCity<int_isRadarCity=0>>>
  bannedObjects:
  - prefab: Player
    filter: int, bfvTeam, <sub_3_<int_isCapturedByTeam=0>>
    maxDistance: <radarDistance<shortnameCity<int_isRadarCity=0>>>
  exec: |
    <clear_raidtime/<shortnameCity<int_isRadarCity=0>>>;
    <clear_raidinprogress/<shortnameCity<int_isRadarCity=0>>
  poke:
  - prefab: nonSiegeStation
    filter: float, CraftingStation.m_rangeBuild, -999;0
    maxDistance: <radarDistance<shortnameCity<int_isRadarCity=0>>>
    delay: 0.1
    parameter: restoreRangeBuild

- prefab: nonSiegeStation
  excludePrefab: piece_artisanstation
  type: poke, restoreRangeBuild
  data: float, CraftingStation.m_rangeBuild, 20
  injectData: false

- prefab: piece_artisanstation
  type: poke, restoreRangeBuild
  data: float, CraftingStation.m_rangeBuild, 40
  injectData: false

