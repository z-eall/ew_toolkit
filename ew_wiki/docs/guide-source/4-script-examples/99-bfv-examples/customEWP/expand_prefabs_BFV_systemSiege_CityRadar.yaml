- prefab: CraftingStation
  type: create
  bannedFilters:
  - int, isBfvSiegeCampPiece, 1
  objects:
  - prefab: CraftingStation
    filter: float, CraftingStation.m_rangeBuild, -999;0
    maxDistance: 110
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <x>,<z>,<add_1_<y>>
    3: string, Raid status in progress
    4: bool, true
  poke:
  - self: true
    delay: 0.1
    parameter: shrinkRangeBuild
  