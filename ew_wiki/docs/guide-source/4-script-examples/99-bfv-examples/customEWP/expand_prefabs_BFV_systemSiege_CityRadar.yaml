#
# When Ram/Catapult explosion happens
- prefab: fx_siegebomb_explosion
  type: create
  bannedKeys: truceday 1
  objects:
  - prefab: AshlandsTreeStump2
    filter: int, isRadarCity, 1;99
    bannedFilter: int, isCapturedByTeam, <load_<pid>/team=0>
  poke:
  - prefab: AshlandsTreeStump2
    filter: int, isRadarCity, 1;99
    limit: 1
    maxDistance: <maxDistanceAllCities>
    parameter: updateRaidTime <pid> <cid>

# Update new raidtime
- prefab: AshlandsTreeStump2
  type: poke, updateRaidTime
  bannedKeys: radarblockercity<int_isRadarCity=0> 1
  poke:
  - self: true
    parameter: triggerRaidInProgress <par_1> <par_2> # playerPID, playerCID
  - prefab: CraftingStation
    bannedFilter: float, CraftingStation.m_rangeBuild, -999;0
    maxDistance: <radarDistance<shortnameCity<int_isRadarCity=0>>>
    parameter: shrinkRangeBuild 

# Announce raid initiated
- prefab: AshlandsTreeStump2
  type: poke, triggerRaidInProgress
  bannedKeys: raidtime/<shortnameCity<int_isRadarCity=0>>
  # bannedKeys: raidinprogress/<shortnameCity<int_isRadarCity=0>>
  # exec: |
    # <save_raidinprogress/<shortnameCity<int_isRadarCity=0>>_1>
  exec: |
    <save_raidtime/<shortnameCity<int_isRadarCity=0>>_<time>>
  commands:
  - wait 0000;broadcast center <#ddd><color<BfvTeam<load_<par_1>/team=0>>><BfvTeam<load_<par_1>/team=0>></color> started a raid at <color<BfvTeam<int_isCapturedByTeam=-1>>><upper_<nameCity<int_isRadarCity=0>>></color>!
  - wait 1000;broadcast center <#ddd><color<BfvTeam<load_<par_1>/team=0>>><BfvTeam<load_<par_1>/team=0>></color> started a raid at <color<BfvTeam<int_isCapturedByTeam=-1>>><upper_<nameCity<int_isRadarCity=0>>></color>!
  - wait 2000;broadcast center <#ddd><color<BfvTeam<load_<par_1>/team=0>>><BfvTeam<load_<par_1>/team=0>></color> started a raid at <color<BfvTeam<int_isCapturedByTeam=-1>>><upper_<nameCity<int_isRadarCity=0>>></color>!
  - wait 3000;broadcast center <#ddd><color<BfvTeam<load_<par_1>/team=0>>><BfvTeam<load_<par_1>/team=0>></color> started a raid at <color<BfvTeam<int_isCapturedByTeam=-1>>><upper_<nameCity<int_isRadarCity=0>>></color>!
  - s <BfvTeam<load_<par_1>/team=0>> started a raid at <upper_<nameCity<int_isRadarCity=0>>>!

