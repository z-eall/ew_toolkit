# ═══════════════════════════════════════════════════════════
# Admin toggle - Admin Mode
# ═══════════════════════════════════════════════════════════
- prefab: Player
  type: say, !adminmode
  admin: true
  cancel: true
  exec: |
    <save_adminmode_<abs_<sub_<load_adminmode=0>_1>>>
  # command: s <msg1AdminMode<load_adminmode=0>>
  objectRpc:
  - name: Message
    1: enum_message, 2
    2: string, <msg2AdminMode<load_adminmode=0>>
    3: int, 1

- type: realtime, second
  keys: adminmode 1
  exec: |
    <save++_adminmoderecovery>

- type: key, adminmoderecovery 30;99999
  exec: |
    <clear_adminmoderecovery>;
    <save_adminmode_0>
  

# ═══════════════════════════════════════════════════════════
# Admin inject team number to all online players
# ═══════════════════════════════════════════════════════════
- prefab: Player
  type: say, !teamfix
  admin: true
  cancel: true
  poke:
  - prefab: Player
    maxDistance: 20000
    parameter: teamfix
    
- prefab: Player
  type: poke, teamfix
  data: int, team, <load_<pid>/team=0>

# ═══════════════════════════════════════════════════════════
# Admin trigger sign lock in area
# ═══════════════════════════════════════════════════════════
- prefab: Player
  type: say, !signlock
  admin: true
  cancel: true
  poke:
  - prefab: sign, sign_white
    maxDistance: 20
    parameter: findNearbySign

- prefab: sign, sign_white
  type: poke, findNearbySign
  data: int, textlock, <abs_<sub_<int_textlock=0>_1>>
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 0
    2: vec, <pos>
    3: string, <msgSignLock<abs_<sub_<int_textlock=0>_1>>>
    4: bool, true
    
# sign text is changed when sign is locked, reloads previous text.  
- prefab: sign, sign_white
  type: change, text
  filter: int, textlock, 1
  data: string, text, <par_2>
  injectData: false
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 0
    2: vec, <pos>
    3: string, <msgSignLock1>
    4: bool, true

