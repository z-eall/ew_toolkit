# ═══════════════════════════════════════════════════════════
# Admin TP - Cities
# ═══════════════════════════════════════════════════════════
- prefab: Player
  type: say, !gocity
  admin: true
  cancel: true
  poke:
  - prefab: AshlandsTreeStump2
    filter: int, isRadarCity, <par_1>
    maxDistance: 20000
    parameter: findBfvCity <zdo>

- prefab: AshlandsTreeStump2
  type: poke, findBfvCity
  poke:
  - target: <par_1>
    parameter: sendPosBfvCity <pos_0,0,10>

- prefab: Player
  type: poke, sendPosBfvCity
  objectRpc:
  - name: RPC_TeleportTo
    1: vec, <par_1>,<par_2>,<par_3>
    2: quat, <a>
    3: bool, true

