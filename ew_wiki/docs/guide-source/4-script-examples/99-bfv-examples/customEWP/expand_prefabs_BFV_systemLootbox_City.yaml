#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Lootbox - City                                  ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
# ═══════════════════════════════════════════════════════════
# Spawner - Gold piles
# ═══════════════════════════════════════════════════════════
- prefab: fx_BonusYield
  type: create
  objects:
  - prefab: Spawner_Bat
    filter: int, goldspawner, 1
    maxDistance: 1
  bannedObjects:
  - prefab: Pickable_DvergrMineTreasure
    maxDistance: 1
  swap:
  - prefab: Pickable_DvergrMineTreasure
    rot: 0,0,0

# ═══════════════════════════════════════════════════════════
# Spawner - Lootbox - Resources - T1 Cities
# ═══════════════════════════════════════════════════════════
# T1 = Riverstone, Windhaven
- prefab: sfx_secretfound
  type: create
  objects:
  - prefab: Spawner_Bat
    filter: int, citylootspawner1, 1
    maxDistance: 1
  bannedObjects:
  - prefab: piece_chest_wood
    maxDistance: 1
  swap:
  - prefab: piece_chest_wood
    data: cityloot1
    triggerRules: true

# ═══════════════════════════════════════════════════════════
# Spawner - Lootbox - Armory - T1 Cities
# ═══════════════════════════════════════════════════════════
# T1 = Riverstone, Windhaven
- prefab: sfx_secretfound
  type: create
  objects:
  - prefab: Spawner_Bat
    filter: int, cityarmoryspawner1, 1
    maxDistance: 1
  bannedObjects:
  - prefab: piece_chest
    maxDistance: 1
  swap:
  - prefab: piece_chest
    data: cityarmory1
    triggerRules: true

# ═══════════════════════════════════════════════════════════
# Spawner - Lootbox - Resources - T2 Cities
# ═══════════════════════════════════════════════════════════
# T2 = Banegard
- prefab: sfx_secretfound
  type: create
  objects:
  - prefab: Spawner_Bat
    filter: int, citylootspawner2, 1
    maxDistance: 1
  bannedObjects:
  - prefab: piece_chest_wood
    maxDistance: 1
  swap:
  - prefab: piece_chest_wood
    data: cityloot2
    triggerRules: true

# ═══════════════════════════════════════════════════════════
# Spawner - Lootbox - Armory - T2 Cities
# ═══════════════════════════════════════════════════════════
# T2 = Banegard
- prefab: sfx_secretfound
  type: create
  objects:
  - prefab: Spawner_Bat
    filter: int, cityarmoryspawner2, 1
    maxDistance: 1
  bannedObjects:
  - prefab: piece_chest
    maxDistance: 1
  swap:
  - prefab: piece_chest
    data: cityarmory2
    triggerRules: true

#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Lootbox Despawn Aesthetic                       ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
# For T1 + T2 chests - Resources
- prefab: piece_chest_wood
  type: destroy
  filter: int, chestnumba, 16;19
  spawn:
  - prefab: vfx_BugRepellent

# For T1 + T2 chests - Resources/Armory
- prefab: piece_chest
  type: destroy
  filters:
  - string, Container.m_name, "Resources"
  - string, Container.m_name, "Armory"
  filterLimit: 1
  spawn:
  - prefab: fx_BonusYield

#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Debugging                                       ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
# Fallback to remove sfx
- prefab: sfx_secretfound
  type: create
  fallback: true
  objects:
  - prefab: Spawner_Bat
    maxDistance: 1
  remove: true