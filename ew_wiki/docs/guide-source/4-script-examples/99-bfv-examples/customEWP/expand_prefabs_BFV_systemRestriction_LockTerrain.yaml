#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Restriction - Lock Terrain                      ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
# ═══════════════════════════════════════════════════════════
# Pre-setup - Data inject to FX
# ═══════════════════════════════════════════════════════════
# Make terraforming fx carry owner character ID
- prefab: allTerraformingFX
  type: create
  data: string, ownerCID, <cid>

# Make terraforming fx carry owner character ID
- prefab: siegebomb_explosion
  type: create
  data: string, ownerCID, <cid>

# ═══════════════════════════════════════════════════════════
# Master trigger
# ═══════════════════════════════════════════════════════════
# Trigger when terrain is modified
- prefab: _TerrainCompiler
  type: change, TCData
  poke:
  - prefab: allTerraformingFX
    filter: string, ownerCID, <cid>
    parameter: checkTerrainLockCondition <zdo> <par_2>
  - prefab: siegebomb_explosion
    filter: string, ownerCID, <cid>
    parameter: checkTerrainLockCondition <zdo> <par_2>

# ═══════════════════════════════════════════════════════════
# Condition 1 - If "Lock" cube is nearby
# ═══════════════════════════════════════════════════════════
# EXCLUDES Admins
- prefab: allTerraformingFX
  type: poke, checkTerrainLockCondition
  admin: false
  objects:
  - prefab: siege_wall_1x1
    filter: string, Piece.m_name, cubeTerrainLock10
    maxDistance: 10
  - prefab: siege_wall_1x1
    filter: string, Piece.m_name, cubeTerrainLock50
    maxDistance: 50
  - prefab: siege_wall_1x1
    filter: string, Piece.m_name, cubeTerrainLock100
    maxDistance: 100
  objectsLimit: 1
  poke:
  - target: <par_1>
    parameter: resetTerrainChange !!! <par_2>

# ═══════════════════════════════════════════════════════════
# Condition 2 - If "Siege Table" is nearby
# ═══════════════════════════════════════════════════════════
# INCLUDES Admins
- prefab: allTerraformingFX
  type: poke, checkTerrainLockCondition
  objects:
  - prefab: piece_siegestation
    maxDistance: 35
  objectsLimit: 1
  poke:
  - target: <par_1>
    parameter: resetTerrainChange !!! <par_2>

# ═══════════════════════════════════════════════════════════
# Condition 3 - If this terraforming comes from Catapult
# ═══════════════════════════════════════════════════════════
# INCLUDES Admins
- prefab: siegebomb_explosion
  type: poke, checkTerrainLockCondition
  poke:
  - target: <par_1>
    parameter: resetTerrainChange !!! <par_2>

# ═══════════════════════════════════════════════════════════
# Ending trigger
# ═══════════════════════════════════════════════════════════
- prefab: _TerrainCompiler
  type: poke, resetTerrainChange
  data: bytes, TCData, <par2=H4sIAAAAAAAACu3YsQ2AMBADwA8TsBGrweaIMgrNSxRGuuviyu8yo6q2Wl37SwgAAADwtdYnxJif5yGYg2pK6R0bVFdK8b/sZbC2lOopexhkldL+o3MeYXUAAACg6wb32BzyoicAAA==>