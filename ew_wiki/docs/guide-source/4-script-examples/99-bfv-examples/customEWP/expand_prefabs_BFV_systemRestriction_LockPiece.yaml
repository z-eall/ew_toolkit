#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Piece Create Lock                               ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
# ═══════════════════════════════════════════════════════════
# Master Piece Create Poke
# ═══════════════════════════════════════════════════════════
- prefab: Piece
  excludePrefab: excludeSiegeCamp,excludeMVBP,smokebomb_explosion,Cinder,Fire,fermenter
  type: create
  bannedFilters:
  - int, pickedUp, 1
  poke:
  - self: true
    parameter: checkBuildCondition
  - prefab: AshlandsTreeStump2
    filter: int, isRadarCity, 1;99
    limit: 1
    maxDistance: 110
    parameter: checkSiegeCondition <zdo>

#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Restricted Area                                 ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
# ═══════════════════════════════════════════════════════════
# Restricted crafting stations
# ═══════════════════════════════════════════════════════════
- prefab: blackforge, eitrrefinery, piece_magetable, piece_artisanstation
  type: poke, checkBuildCondition
  weight: 1e30
  bannedKeys: adminmode 1
  objects:
  - prefab: siege_wall_1x1
    filter: string, Piece.m_name, cubeBuildLock1000
    maxDistance: 1000
  drops: true
  remove: true
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <x>,<z>,<add_1_<y>>
    3: string, Unable to build that on this island
    4: bool, true

# ═══════════════════════════════════════════════════════════
# Restricted build area - 5m
# ═══════════════════════════════════════════════════════════
- prefab: Piece
  type: poke, checkBuildCondition
  weight: 1e30
  bannedKeys: adminmode 1
  objects:
  # - prefab: wood_floor_1x1 # Old piece used
    # filter: int, nobuildarea5m, 1
    # maxDistance: 5
    # maxHeight: 5
  - prefab: siege_wall_1x1 # New standardised piece
    filter: string, Piece.m_name, cubeBuildLock5
    maxDistance: 5
    maxHeight: 5
  objectsLimit: 1
  remove: true
  drops: true
  clientRpc:
  - name: ShowMessage
    1: enum_message, 2
    2: string, <#FF0000> Can't Build Here

