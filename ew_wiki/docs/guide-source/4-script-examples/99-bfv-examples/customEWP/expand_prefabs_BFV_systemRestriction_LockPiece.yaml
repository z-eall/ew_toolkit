#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Castle Distance                                 ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
# ═══════════════════════════════════════════════════════════
# Restricted faction ward - Too far from powerstone or siege camp
# ═══════════════════════════════════════════════════════════
- prefab: BetterWard_Type3, BetterWard_Type4
  type: poke, checkBuildCondition
  weight: 1e30
  bannedKeys: adminmode 1
  bannedObjects:
  - prefab: AshlandsTreeStump2
    filter: int, isRadarCity, 1;99
    maxDistance: 100
  - prefab: piece_siegestation
    filter: int, isBfvSiegeCampPiece, 1
    maxDistance: 15
  bannedObjectsLimit: 1
  remove: true
  drops: true
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <x>,<z>,<add_1_<y>>
    3: string, Ward too far from Powerstone or Siege Camp
    4: bool, true

