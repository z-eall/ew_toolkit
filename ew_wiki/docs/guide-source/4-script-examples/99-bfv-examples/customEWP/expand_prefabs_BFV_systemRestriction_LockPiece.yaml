# ═══════════════════════════════════════════════════════════
- prefab: piece_shieldgenerator,castleBlacklist
  type: poke, checkBuildCondition
  weight: 1e30
  bannedKeys: adminmode 1
  objects:
  # - prefab: wood_beam_1 # Old piece used
    # filter: string, Piece.m_name, castle_piece
    # maxDistance: 180
  - prefab: AshlandsTreeStump2 # New standardised piece
    filter: int, isRadarCity, 1;99
    maxDistance: 180
  objectsLimit: 1
  remove: true
  drops: true
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <x>,<z>,<add_1_<y>>
    3: string, Can't build this near a Castle
    4: bool, true

#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Anti-Exploit                                    ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
# ═══════════════════════════════════════════════════════════
# Restricted Chair glitch
# ═══════════════════════════════════════════════════════════
# Remove chair if at Sunken Crypt
- prefab: Chair, piece_barber, Bed, TeleportWorld
  type: poke, checkBuildCondition
  weight: 1e30
  bannedKeys: adminmode 1
  locations: SunkenCrypt4
  drops: true
  remove: true
  clientRpc:
  - name: ShowMessage
    1: enum_message, 2
    2: string, <#FF0000>Can't build <string_Piece.m_name> near Sunken Crypts!

# Remove chair if too close to rocks
- prefab: Chair, piece_barber, Bed, TeleportWorld
  excludePrefab: Ship
  type: poke, checkBuildCondition
  weight: 1e30
  bannedKeys: adminmode 1
  objects:
  - prefab: Destructible
    filter: isRockHollow
    maxDistance: 10
  # - prefab: rock2_heath_frac
    # maxDistance: 10
  # - prefab: rock2_heath
    # maxDistance: 10
  # - prefab: rock4_forest_frac
    # maxDistance: 10
  # - prefab: rock4_forest
    # maxDistance: 10
  # - prefab: rock4_copper_frac
    # maxDistance: 10
  # - prefab: rock4_copper
    # maxDistance: 10
  objectsLimit: 1
  bannedObjects:
  - prefab: AshlandsTreeStump2
    filter: int, isRadarCity, 1;99
    maxDistance: 20
  drops: true
  remove: true
  clientRpc:
  - name: ShowMessage
    1: enum_message, 2
    2: string, <#FF0000>Can't build <string_Piece.m_name> here!

# ═══════════════════════════════════════════════════════════
# Restricted build with enemy in range
# ═══════════════════════════════════════════════════════════
- prefab: Piece
  type: poke, checkBuildCondition
  bannedFilters:
  - int, stack, 1;999999
  - int, pickedUp, 1
  weight: 1e30
  bannedKeys: adminmode 1
  objects:
  - prefab: Player
    filter: int, bfvTeam, <sub_3_<load_<pid>/team=0>>
    bannedFilter: int, $crouching, 1
    maxDistance: 10
    maxHeight: 10
  remove: true
  drops: true
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <x>,<z>,<add_2_<y>>
    3: string, Enemy nearby
    4: bool, false

# ═══════════════════════════════════════════════════════════
# Restricted build with enemy in range
# ═══════════════════════════════════════════════════════════
- prefab: AshlandsTreeStump2
  type: poke, checkSiegeCondition # From master poke above
  weight: 1e30
  bannedKeys: adminmode 1
  keys: raidtime/<shortnameCity<int_isRadarCity=0>>
  poke:
  - target: <par_1>
    parameter: removeBuildDuringRaid

- prefab: Piece
  type: poke, removeBuildDuringRaid
  remove: true
  drops: true
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <x>,<z>,<add_2_<y>>
    3: string, Raid status in progress
    4: bool, false