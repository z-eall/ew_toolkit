# Loot drop
- prefab: Ragdoll_Asksvin
  type: create
  objects:
  - prefab: Spawner_Bat
    filter: string, isSpawningPrefabData, galmor
    maxDistance: 50
  remove: true
  removeDelay: <add_-1_<float_Ragdoll.m_ttl=3>>
  spawn:
  - prefab: vfx_corpse_destruction_medium
    delay: <add_-1_<float_Ragdoll.m_ttl=3>>
  - prefab: TrinketScaleStaminaDamage
    chance: 0.4
    delay: <add_-1_<float_Ragdoll.m_ttl=3>>
  - prefab: CapeAsksvin
    chance: 0.4
    delay: <add_-1_<float_Ragdoll.m_ttl=3>>
  - prefab: GemstoneRed
    chance: 0.05
    delay: <add_-1_<float_Ragdoll.m_ttl=3>>
  - prefab: GemstoneGreen
    chance: 0.05
    delay: <add_-1_<float_Ragdoll.m_ttl=3>>
  - prefab: GemstoneBlue
    chance: 0.05
    delay: <add_-1_<float_Ragdoll.m_ttl=3>>

