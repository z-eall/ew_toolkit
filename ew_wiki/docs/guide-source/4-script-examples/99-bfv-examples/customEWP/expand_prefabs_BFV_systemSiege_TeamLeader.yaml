# ═══════════════════════════════════════════════════════════
# Command House
# ═══════════════════════════════════════════════════════════
- prefab: Pickable_Mushroom, Pickable_Mushroom_blue
  type: change, picked 1
  filters: 
  - int, isCommandHouseTeam, 1;2
  remove: true
  spawn:
  - prefab: <prefab>
    data: isCommandHouseTeam<int_isCommandHouseTeam=1>
  poke:
  - prefab: Player
    limit: 1
    maxDistance: 5
    parameter: TeleportPlayerRedLead <pos_0,1,-2.5> <int_isCommandHouseTeam=0>

- prefab: Player
  type: poke, TeleportPlayerRedLead
  keys: <pid>/teamlead <par_2>
  objectRpc:
  - name: RPC_TeleportTo
    1: vec, <par_1>,<par_2>,<par_3>
    2: quat, <a>
    3: bool, true

