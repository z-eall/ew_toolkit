# # Respawn the ram for client sync
# - prefab: Vagon
  # type: poke, detachOwnedVagon
  # # command: s reset <int_isRamStrongHold=2> #debug
  # swap:
  # - prefab: <prefab>
  # spawn:
  # - prefab: sfx_build_hammer_metal
  # - prefab: vfx_Place_cart
    # pos: 0,0,1.5
#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Apply Ram Buff                                  ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
- prefab: BatteringRam, BatteringRamBronze, BatteringRamBM
  types:
  - change, attachJoint 1
  - poke, checkIfStillOwnRam
  bannedFilter: int, attachJoint, 0
  poke:
  - prefab: Player
    filter: long, playerID, <cid>
    maxDistance: 5
    parameter: applyRamSE <zdo>

- prefab: Player
  type: poke, applyRamSE
  objectRpc:
  - name: RPC_Damage
    1: hit, status=BatteringRam
  spawn:
  - prefab: fx_charred_hit
    pos: 0,0,1
  - prefab: vfx_auto_pickup
    pos: 0,0,1
  poke:
  - target: <par_1>
    filter: string, ownerPlayerID, <cid>
    maxDistance: 5
    delay: 4.5
    parameter: checkIfStillOwnRam

