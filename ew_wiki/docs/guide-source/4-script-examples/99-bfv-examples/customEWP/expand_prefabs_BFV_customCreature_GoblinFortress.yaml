# KORBASH MEETING QUEST
# ═══════════════════════════════════════════════════════════

- prefab: vfx_seekerbrute_groundslam
  type: create
  objects:
  - prefab: MarketPlaceNPC
    filter: string, KGnpcDialogue, korbash_brazier
    maxDistance: 50
  spawn:
  - prefab: Goblin
    data: tribalfighter
    delay: 2
    triggerRules: true
  poke:
  - prefab: Player
    maxDistance: 30
    parameter: GoblinAmbushStun
    
- prefab: Player
  type: poke, GoblinAmbushStun
  objectRpc:
  - name: RPC_Stagger
    1: vec, <a>
  - name: RPC_AddStatusEffect
    1: hash, Immobilized
    2: bool, true
    3: int, 1
    4: float, 1  
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <x>,<z>,<add_1_<y>>
    3: string, IT'S AN AMBUSH!
    4: bool, true
  
