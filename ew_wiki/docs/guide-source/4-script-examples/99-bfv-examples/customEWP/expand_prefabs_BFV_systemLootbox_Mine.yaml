#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Lootbox Despawn Aesthetic                       ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
- prefab: piece_chest_wood
  type: destroy
  filter: int, chestnumba, 13;15
  spawn:
  - prefab: vfx_BugRepellent

