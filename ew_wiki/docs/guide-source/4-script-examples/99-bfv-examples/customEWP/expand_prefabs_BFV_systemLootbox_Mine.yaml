# ╚═══════════════════════════════════════════════════════════╝
#
# ═══════════════════════════════════════════════════════════
# Spawner - Lootbox - T1 Mine
# ═══════════════════════════════════════════════════════════
# Black Forest
- prefab: sfx_secretfound
  type: create
  objects:
  - prefab: Spawner_Bat
    filter: int, minelootspawner1, 1
    maxDistance: 1
  bannedObjects:
  - prefab: piece_chest_wood
    maxDistance: 1
  swap:
  - prefab: piece_chest_wood
    data: mineloot1
    triggerRules: true

# ═══════════════════════════════════════════════════════════
# Spawner - Lootbox - T2 Mine
# ═══════════════════════════════════════════════════════════
