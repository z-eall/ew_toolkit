# ═══════════════════════════════════════════════════════════
# Poke from Powerstone - Portal City
# ═══════════════════════════════════════════════════════════
  # # Change Visual Powerstone Portal City
  # - prefab: MarketPlaceNPC
    # filter: string, KGnpcDialogue, portal_city<int_isBfvPowerstoneCity=0>
    # maxDistance: 200
    # parameter: changeBfvPowerstonePortalCity <load_<par_1>/team=-1> <int_isBfvPowerstoneCity=0> <int_isBfvPowerstone=-1> # capturingPlayerTeam, pstoneCityNumber, currentPstoneOwnerTeam

# ═══════════════════════════════════════════════════════════
# Update Powerstone visual - Portal City
# ═══════════════════════════════════════════════════════════
- prefab: MarketPlaceNPC
  type: poke, changeBfvPowerstonePortalCity
  commands:
  - broadcast center <#ddd><#fff000><size=38><upper_<nameCity<par_2>>></color><br>CAPTURED BY THE <color<BfvTeam<par_1>>><upper_<pluralBfvTeam<par_1>>></color>!
  - broadcast center <#ddd><#fff000><size=38><upper_<nameCity<par_2>>></color><br>CAPTURED BY THE <color<BfvTeam<par_1>>><upper_<pluralBfvTeam<par_1>>></color>!
  - broadcast center <#ddd><#fff000><size=38><upper_<nameCity<par_2>>></color><br>CAPTURED BY THE <color<BfvTeam<par_1>>><upper_<pluralBfvTeam<par_1>>></color>!
  - s <upper_<nameCity<par_2>>> WAS CAPTURED BY THE <upper_<pluralBfvTeam<par_1>>>!
  - <setkeyTeam<BfvTeam<par_1>>>
  - <removekeyTeam<BfvTeam<par_1>>>
  data: string, KGnpcModelOverride, <portalPowerstone<BfvTeam<par_1>>>
  injectData: false

# ═══════════════════════════════════════════════════════════
# Poke from Powerstone - Portal Gate
# ═══════════════════════════════════════════════════════════
  # # Change Visual Powerstone Portal Gate
  # - prefab: MarketPlaceNPC
    # filters:
    # - string, KGnpcDialogue, gate_city<int_isBfvPowerstoneCity=0>blue
    # - string, KGnpcDialogue, gate_city<int_isBfvPowerstoneCity=0>red
    # filterLimit: 1
    # maxDistance: 20000
    # parameter: changeBfvPowerstonePortalGate <load_<par_1>/team=-1> <int_isBfvPowerstoneCity=0> <int_isBfvPowerstone=-1> # capturingPlayerTeam, pstoneCityNumber, currentPstoneOwnerTeam

# ═══════════════════════════════════════════════════════════
# Update Powerstone visual - Portal Gate (Base Camp)
# ═══════════════════════════════════════════════════════════
# If Capturing team is NOT -1 - Raider
# Change portal gate - Capture Team ON
- prefab: MarketPlaceNPC
  type: poke, changeBfvPowerstonePortalGate
  fallback: true
  filter: string, KGnpcDialogue, gate_city<par_2><portalBfvTeam<par_1>>
  data: string, KGnpcModelOverride, <portalPowerstone<BfvTeam<par_1>>>
  injectData: false

# Change portal gate - Opposed Team OFF
- prefab: MarketPlaceNPC
  type: poke, changeBfvPowerstonePortalGate
  fallback: true
  filter: string, KGnpcDialogue, gate_city<par_2><portalBfvTeam<sub_3_<par_1>>>
  data: string, KGnpcModelOverride, <portalPowerstoneRaider>
  injectData: false

# If Capturing team is NOT -1 - Raider
# Change portal gate - Capture Team ON
- prefab: MarketPlaceNPC
  type: poke, changeBfvPowerstonePortalGate -1
  weight: 1e30
  data: string, KGnpcModelOverride, <portalPowerstone<BfvTeam<par_1>>>
  injectData: false


