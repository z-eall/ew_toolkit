#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Powerstone Capture                              ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
# ═══════════════════════════════════════════════════════════
# Only melee attacks be recognized
# ═══════════════════════════════════════════════════════════
- prefab: Player
  type: state, freezeframe
  objects:
  - prefab: cauldron_ext3_butchertable
    filters:
    - int, isBfvPowerstone, -1
    - int, isBfvPowerstone, 1
    - int, isBfvPowerstone, 2
    filterLimit: 1
    offset: 0,1,0
    maxDistance: 1
    maxHeight: 1
  poke:
  - self: true
    delay: 0.1
    parameter: checkHitCooldownPowerstone <ge_<floor_<sub_<time>_<load_<pid>/pstonehitcooldown=0>>>_<hitCooldownPowerstone>>

# ═══════════════════════════════════════════════════════════
# Check if Powerstone hit cooldown passed
# ═══════════════════════════════════════════════════════════
- prefab: Player
  type: poke, checkHitCooldownPowerstone true
  exec: |
    <save_<pid>/pstonehitcooldown_<time>>
  poke:
  - prefab: cauldron_ext3_butchertable
    filters:
    - int, isBfvPowerstone, -1
    - int, isBfvPowerstone, 1
    - int, isBfvPowerstone, 2
    filterLimit: 1
    offset: 0,1,0
    maxDistance: 1
    maxHeight: 1
    limit: 1
    parameter: findBfvPowerstone <pid> <damageRangePowerstone> # capturingPlayerPID, capturingPlayerDmg

# ═══════════════════════════════════════════════════════════
# Inject damage value to Powerstone - Raiders
# For Riverstone, Windhaven, Banegard
# Ignore raid window, ignore raid-in-progress
# ═══════════════════════════════════════════════════════════
- prefab: cauldron_ext3_butchertable
  type: poke, findBfvPowerstone
   # commands:
   # - s <BfvTeam<load_<par_1>/team=-1>> hit Powerstone <BfvTeam<int_isBfvPowerstone=-1>>
  fallback: true
  filters:
  - int, isBfvPowerstone, -1
  - int, isBfvPowerstoneCity, 1;3
  # - int, isBfvPowerstone, <sub_3_<load_<par_1>/team=-1>>
  # filterLimit: 1
  # keys: raidtime/<shortnameCity<int_isBfvPowerstoneCity=0>>
  # bannedKeys: raidwindow 0
  data: float, isBfvPowerstoneHealth, <add_<par_2>_<float_isBfvPowerstoneHealth=0>>
  triggerRules: true
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 0
    2: vec, <x>,<z>,<y>
    3: string, <par_2>
    4: bool, false
  spawn:
  - prefab: <effectHit<BfvTeam<int_isBfvPowerstone=-1>>>
    pos: <effectHitPos<BfvTeam<int_isBfvPowerstone=-1>>>
    rot: <effectHitRot<BfvTeam<int_isBfvPowerstone=-1>>>
  - prefab: fx_ShieldCharge_4
    pos: 0,0,0.5
    # rot: 0,90,0
  - prefab: sfx_dverger_heal_finish
  poke:
  - self: true
    delay: 0.1
    parameter: checkBfvPowerstoneHealth <par_1> # capturingPlayerPID

# ═══════════════════════════════════════════════════════════
# Inject damage value to Powerstone - Raiders
# For other all PvE cities
# Ignore raid window, Respect raid-in-progress
# ═══════════════════════════════════════════════════════════
- prefab: cauldron_ext3_butchertable
  type: poke, findBfvPowerstone
   # commands:
   # - s <BfvTeam<load_<par_1>/team=-1>> hit Powerstone <BfvTeam<int_isBfvPowerstone=-1>>
  fallback: true
  filters:
  - int, isBfvPowerstone, -1
  - int, isBfvPowerstoneCity, 4;14
  # - int, isBfvPowerstone, <sub_3_<load_<par_1>/team=-1>>
  # filterLimit: 1
  keys: raidtime/<shortnameCity<int_isBfvPowerstoneCity=0>>
  # bannedKeys: raidwindow 0
  data: float, isBfvPowerstoneHealth, <add_<par_2>_<float_isBfvPowerstoneHealth=0>>
  triggerRules: true
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 0
    2: vec, <x>,<z>,<y>
    3: string, <par_2>
    4: bool, false
  spawn:
  - prefab: <effectHit<BfvTeam<int_isBfvPowerstone=-1>>>
    pos: <effectHitPos<BfvTeam<int_isBfvPowerstone=-1>>>
    rot: <effectHitRot<BfvTeam<int_isBfvPowerstone=-1>>>
  - prefab: fx_ShieldCharge_4
    pos: 0,0,0.5
    # rot: 0,90,0
  - prefab: sfx_dverger_heal_finish
  poke:
  - self: true
    delay: 0.1
    parameter: checkBfvPowerstoneHealth <par_1> # capturingPlayerPID

# ═══════════════════════════════════════════════════════════
# Inject damage value to Powerstone - Captured
# For all captured cities
# Respect raid window, Respect raid-in-progress
# ═══════════════════════════════════════════════════════════
- prefab: cauldron_ext3_butchertable
  type: poke, findBfvPowerstone
   # commands:
   # - s <BfvTeam<load_<par_1>/team=-1>> hit Powerstone <BfvTeam<int_isBfvPowerstone=-1>>
  fallback: true
  filters:
  # - int, isBfvPowerstone, -1
  - int, isBfvPowerstone, <sub_3_<load_<par_1>/team=-1>>
  # filterLimit: 1
  keys: raidtime/<shortnameCity<int_isBfvPowerstoneCity=0>>
  bannedKeys: raidwindow 0
  spawn: vfx_spawn_small
  poke:
  - self: true
    delay: 0.1
    parameter: checkCaptureCooldownPowerstone <ge_<floor_<sub_<time>_<load_captureblockercity<int_isBfvPowerstoneCity=0>=0>>>_<captureCooldownPowerstone>> <par_1> <par_2> # captureCooldown, capturingPlayerPID, capturingPlayerDmg

# Print cooldown during capture cooldown
- prefab: cauldron_ext3_butchertable
  type: poke, checkCaptureCooldownPowerstone
  fallback: true
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <x>,<z>,<y>
    3: string, Cooling down for <ceil_<div_<sub_<captureCooldownPowerstone>_<sub_<time>_<load_captureblockercity<int_isBfvPowerstoneCity=0>=0>>>_60>> minutes
    4: bool, false

# Proceed damage outside capture cooldown
- prefab: cauldron_ext3_butchertable
  type: poke, checkCaptureCooldownPowerstone true
  weight: 1e30
  data: float, isBfvPowerstoneHealth, <add_<par_3>_<float_isBfvPowerstoneHealth=0>>
  triggerRules: true
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 0
    2: vec, <x>,<z>,<y>
    3: string, <par_3>
    4: bool, false
  spawn:
  - prefab: <effectHit<BfvTeam<int_isBfvPowerstone=-1>>>
    pos: <effectHitPos<BfvTeam<int_isBfvPowerstone=-1>>>
    rot: <effectHitRot<BfvTeam<int_isBfvPowerstone=-1>>>
  - prefab: fx_ShieldCharge_4
    pos: 0,0,0.5
    # rot: 0,90,0
  - prefab: sfx_dverger_heal_finish
  poke:
  - self: true
    delay: 0.1
    parameter: checkBfvPowerstoneHealth <par_2> # capturingPlayerPID

# ═══════════════════════════════════════════════════════════
# Check Powerstone health threshold exceeded
# ═══════════════════════════════════════════════════════════
- prefab: cauldron_ext3_butchertable
  type: poke, checkBfvPowerstoneHealth
  filter: float, isBfvPowerstoneHealth, <healthPowerstone>;999999
  exec: |
    <clear_raidtime/<shortnameCity<int_isBfvPowerstoneCity=0>>>;
    <clear_raidinprogress/<shortnameCity<int_isBfvPowerstoneCity=0>>
  data: isBfvPowerstone<BfvTeam<load_<par_1>/team=-1>>
  spawn:
  - prefab: fx_GP_Stone
    pos: 0,0,1
  - prefab: fx_Adrenaline1
    delay: 2
  - prefab: fx_DvergerMage_MistileSpawn
    delay: 2
  - prefab: fx_GP_Activation
    pos: 0,0,1
    delay: 2
  poke:
  # Change Visual Powerstone Brazier
  - prefab: MountainKit_brazier*
    filters:
    - int, isBfvPowerstoneBrazier, -1
    - int, isBfvPowerstoneBrazier, 1
    - int, isBfvPowerstoneBrazier, 2
    filterLimit: 1
    maxDistance: 0.2
    limit: 2
    parameter: changeBfvPowerstoneBrazier <load_<par_1>/team=-1> # capturingPlayerTeam
  # Change Visual Powerstone Sign - Healthbar
  - prefab: Sign
    filter: int, isBfvPowerstoneSign, <int_isBfvPowerstone=-1>
    limit: 1
    maxDistance: 0.3
    parameter: changeBfvPowerstoneSign <load_<par_1>/team=-1> # capturingPlayerTeam
  # Change Visual Powerstone Banner
  - prefab: <bannerPowerstone<BfvTeam<int_isBfvPowerstone=-1>>>
    filters:
    - int, isBfvPowerstoneBanner, -1
    - int, isBfvPowerstoneBanner, 1
    - int, isBfvPowerstoneBanner, 2
    filterLimit: 1
    maxDistance: 200
    parameter: changeBfvPowerstoneBanner <load_<par_1>/team=-1> # capturingPlayerTeam
  # Change Visual Powerstone Portal City
  - prefab: MarketPlaceNPC
    filter: string, KGnpcDialogue, portal_city<int_isBfvPowerstoneCity=0>
    maxDistance: 200
    parameter: changeBfvPowerstonePortalCity <load_<par_1>/team=-1> <int_isBfvPowerstoneCity=0> <int_isBfvPowerstone=-1> # capturingPlayerTeam, pstoneCityNumber, currentPstoneOwnerTeam
  # Change Visual Powerstone Portal Gate
  - prefab: MarketPlaceNPC
    filters:
    - string, KGnpcDialogue, gate_city<int_isBfvPowerstoneCity=0>blue
    - string, KGnpcDialogue, gate_city<int_isBfvPowerstoneCity=0>red
    filterLimit: 1
    maxDistance: 20000
    parameter: changeBfvPowerstonePortalGate <load_<par_1>/team=-1> <int_isBfvPowerstoneCity=0> <int_isBfvPowerstone=-1> # capturingPlayerTeam, pstoneCityNumber, currentPstoneOwnerTeam
  # Change City Radar CaptureBy Data
  - prefab: AshlandsTreeStump2
    filter: int, isRadarCity, 1;99
    maxDistance: 200
    parameter: changeRadarCityData <load_<par_1>/team=-1> <int_isBfvPowerstone=-1> # capturingPlayerTeam, currentPstoneOwnerTeam
  # Restore Build Range upon Capture
  - prefab: nonSiegeStation
    filter: float, CraftingStation.m_rangeBuild, -999;0
    maxDistance: <radarDistance<shortnameCity<int_isBfvPowerstone=-1>>>
    delay: 0.1
    parameter: restoreRangeBuild

# ═══════════════════════════════════════════════════════════
# Update Powerstone visual - Brazier
# ═══════════════════════════════════════════════════════════
- prefab: MountainKit_brazier*
  type: poke, changeBfvPowerstoneBrazier
  swap:
  - prefab: <brazierPowerstone<BfvTeam<par_1>>>
    data: isBfvPowerstoneBrazier

# ═══════════════════════════════════════════════════════════
# Update Powerstone visual - Banner
# ═══════════════════════════════════════════════════════════
- prefab: piece_banner11, piece_banner02, piece_banner04
  type: poke, changeBfvPowerstoneBanner
  swap:
  - prefab: <bannerPowerstone<BfvTeam<par_1>>>
    data: isBfvPowerstoneBanner

# ═══════════════════════════════════════════════════════════
# Update City Radar Data
# ═══════════════════════════════════════════════════════════
- prefab: AshlandsTreeStump2
  type: poke, changeRadarCityData
  data: int, isCapturedByTeam, <par_1>
  injectData: false
  exec: |
    <save_radarblockercity<int_isRadarCity=0>_1>;
    <save_captureblockercity<int_isRadarCity=0>_<time>>
  poke:
  - prefab: AshlandsTreeStump2
    filter: int, isRadarCity, <int_isRadarCity=0>
    limit: 1
    maxDistance: 5
    delay: <radarBlockerDuration>
    parameter: removeCityRadarBlocker

- prefab: AshlandsTreeStump2
  type: poke, removeCityRadarBlocker
  exec: |
    <clear_radarblockercity<int_isRadarCity=0>>

#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Powerstone Sign - Healthbar                     ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
# ═══════════════════════════════════════════════════════════
# Update Powerstone current health
# ═══════════════════════════════════════════════════════════
- prefab: cauldron_ext3_butchertable
  type: change, isBfvPowerstoneHealth
  filters:
  - int, isBfvPowerstone, -1
  - int, isBfvPowerstone, 1
  - int, isBfvPowerstone, 2
  filterLimit: 1
  poke:
  - prefab: Sign
    filter: int, isBfvPowerstoneSign, <int_isBfvPowerstone=-1>
    limit: 1
    maxDistance: 0.3
    delay: 0.1
    parameter: updateBfvPowerstoneSign <int_isBfvPowerstone=-1> <hpBarStages> # currentPstoneOwnerTeam, hpBarFormula

# ═══════════════════════════════════════════════════════════
# Update Powerstone visual - Signs(Healthbar)
# ═══════════════════════════════════════════════════════════
- prefab: Sign
  type: poke, updateBfvPowerstoneSign
  data: string, text, <hpBarPowerstone<par_2>>
  # injectData: false

# Change Powerstone sign color
- prefab: Sign
  type: poke, changeBfvPowerstoneSign
  data: isBfvPowerstoneSign

#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Powerstone Heal Spawner                         ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
# ═══════════════════════════════════════════════════════════
# Check conditions if valid to heal
# ═══════════════════════════════════════════════════════════
- prefab: sfx_secretfound
  type: create
  remove: true
  objects:
  - prefab: cauldron_ext3_butchertable
    filters:
    - int, isBfvPowerstone, -1
    - int, isBfvPowerstone, 1
    - int, isBfvPowerstone, 2
    filterLimit: 1
    maxDistance: 0.3
  poke:
  - prefab: cauldron_ext3_butchertable
    filters:
    - int, isBfvPowerstone, 1
    - int, isBfvPowerstone, 2
    filterLimit: 1
    maxDistance: 0.3
    parameter: healPowerstoneIfValid
  - prefab: AshlandsTreeStump2
    filter: int, isRadarCity, 1;99
    limit: 1
    parameter: checkRaidIfOver # This go to systemCityRadar
  - prefab: AshlandsTreeStump2
    filter: int, isRadarCity, 1;99
    limit: 1
    parameter: checkIfEnemyPresent # This go to systemCityRadar

# ═══════════════════════════════════════════════════════════
# Start healing
# ═══════════════════════════════════════════════════════════
- prefab: cauldron_ext3_butchertable
  type: poke, healPowerstoneIfValid
  bannedFilter: float, isBfvPowerstoneHealth, 0
  bannedObjects:
  - prefab: Player
    filter: int, bfvTeam, <sub_3_<int_isBfvPowerstone=-1>>
    maxDistance: 5
  data: float, isBfvPowerstoneHealth, <max_0_<sub_<float_isBfvPowerstoneHealth=0>_<healAmountPowerstone>>>
  triggerRules: true
  spawn:
  - prefab: fx_Potion_frostresist
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 4
    2: vec, <x>,<z>,<y>
    3: string, <healAmountPowerstone>
    4: bool, false

