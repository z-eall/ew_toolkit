# ═══════════════════════════════════════════════════════════
# Spawner - Wood Logs - Birch
# ═══════════════════════════════════════════════════════════
- prefab: fx_sw_produce
  type: create
  objects:
  - prefab: Spawner_Bat
    filter: int, birchspawner, 1
    maxDistance: 1
  bannedObjects:
  - prefab: Birch_log_half
    maxDistance: 5
  swap:
  - prefab: Birch_log_half
    rot: 0,90,0
    pos: 0,0,1

