# ═══════════════════════════════════════════════════════════
# FALLEN CITY - BOSS - MORGOTHAR
# ═══════════════════════════════════════════════════════════
# Bring VoidEssence to POI, then
# Spawn from interacting with MarketPlaceNPC
- prefab: sfx_goblinking_taunt
  type: create
  objects:
  # - prefab: wood_pole # Old objects
    # filter: string, Piece.m_name, morgothar_spawn
    # maxDistance: 20
  - prefab: MarketPlaceNPC
    filter: string, KGnpcDialogue, soulforge
    maxDistance: 20
  - prefab: MarketPlaceNPC
    filter: string, KGnpcDialogue, soulforge_off
    maxDistance: 20
  objectsLimit: 1
  poke:
  - prefab: MarketPlaceNPC
    filter: string, KGnpcDialogue, soulforge_off
    maxDistance: 20
    delay: 0.1
    parameter: checkCooldownMorgothar
  - prefab: MarketPlaceNPC
    filter: string, KGnpcDialogue, soulforge
    maxDistance: 20
    parameter: spawnMorgothar

# Print error if cooldown not passed
- prefab: MarketPlaceNPC
  type: poke, checkCooldownMorgothar
  fallback: true
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 2
    2: vec, <pos>
    3: string, Can't summon yet.
    4: bool, true

# Reset NPC if cooldown passed
- prefab: MarketPlaceNPC
  type: poke, checkCooldownMorgothar
  weight: 1e30
  filter: float, stamp, 0;<sub_<time>_7200>
  data: morgotharSpawner_on
  spawn:
  - prefab: vfx_HealthUpgrade
    pos: 0,0,1

# Spawn Morgothar
- prefab: MarketPlaceNPC
  type: poke, spawnMorgothar
  commands:
  - s MORGOTHAR IS BEING SUMMONED FROM THE VOID!
  data: morgotharSpawner_off
  spawns:
  - fx_GP_Player, 0,0,0
  - vfx_troll_summoned_prespawn, -4,20,-9
  - fx_DvergerMage_Support_hit, -4,20,0
  - vfx_ghost_death, -4,20,-1
  - vfx_ghost_death, -7,22,0
  - vfx_ghost_death, -4,19,4
  - vfx_ghost_death, -2,24,-1
  - Morgen, morgothar, -4,20,2, 4
  - fx_DvergerMage_Mistile_attack, -4,20,-1, 4
  - vfx_Place_digg, -4,20,-1, 4
  - fx_fader_meteor_hit, -4,20,8, 4
  - fx_fader_meteor_hit, -8,26,10, 4
  - fx_fader_meteor_hit, 0,25,8, 4
  - fx_dragon_land, -4,20,-1, 4
  - sfx_gdking_scream, -4,20,0, 4
  - sfx_morgothar_summon, 0,0,6, 5

# Loot drop
- prefab: Morgen
  type: destroy
  commands:
  - s MORGOTHAR IS SLAIN! HIS TREASURE HAS SPAWNED BEFORE THE ALTAR...
  filter: string, Humanoid.m_name, "Morgothar"
  spawn:
  - prefab: piece_chest
    data: loot_morgothar
    delay: 4
    triggerRules: true
  - prefab: fx_GP_Stone
    delay: 4
  - prefab: vfx_HearthAddFuel
    delay: 4
  - prefab: sfx_morgothar_death
    delay: 1
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 2
    2: vec, <pos>
    3: string, Treasure Dropped!
    4: bool, true
    delay: 4
  poke:
  - prefab: Player
    maxDistance: 50
    delay: 4
    parameter: questDropMorgothar

# Quest loot drop
- prefab: Player
  type: poke, questDropMorgothar
  spawn:
  - prefab: TrophyMorgothar
  - prefab: sfx_metal_shield_blocked
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <x>,<z>,<add_1_<y>>
    3: string, Trophy dropped!
    4: bool, true

# Loot drop removal aesthetic
- prefab: piece_chest
  type: destroy
  filter: string, Container.m_name, "Morgothar's Treasure"
  spawn:
  - prefab: fx_GP_Stone
  - prefab: vfx_HearthAddFuel

# Loot drop removal
- prefab: Chain
  type: create
  filter: int, pickedUp, 0
  objects:
  # - prefab: wood_pole # Old objects
    # filter: string, Piece.m_name, morgothar_spawn
    # maxDistance: 80
  - prefab: MarketPlaceNPC
    filter: string, KGnpcDialogue, soulforge
    maxDistance: 80
  - prefab: MarketPlaceNPC
    filter: string, KGnpcDialogue, soulforge_off
    maxDistance: 80
  objectsLimit: 1
  remove: true