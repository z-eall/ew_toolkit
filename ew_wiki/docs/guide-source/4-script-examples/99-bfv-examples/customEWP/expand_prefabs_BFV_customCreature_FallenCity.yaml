# ═══════════════════════════════════════════════════════════
# FALLEN CITY - BOSS - VALDRAKA
# ═══════════════════════════════════════════════════════════
# Hang the bell at POI, then
# Spawn from interacting with MarketPlaceNPC
- prefab: sfx_goblinbrute_clubswing
  type: create
  objects:
  - prefab: fader_bellholder
    filter: string, Piece.m_name, bell_val
    maxDistance: 5
  poke:
  - prefab: fader_bellholder
    maxDistance: 5
    filter: string, item, Bell
    parameter: checkCooldownValdraka

# Print error if cooldown not passed
- prefab: fader_bellholder
  type: poke, checkCooldownValdraka
  fallback: true
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 2
    2: vec, <pos>
    3: string, Can't summon yet.
    4: bool, true

# Spawn Valdraka if cooldown passed
- prefab: fader_bellholder
  type: poke, checkCooldownValdraka
  weight: 1e30
  filter: float, stamp, 0;<sub_<time>_1800>
  data: float, stamp, <time>
  spawns:
  - sfx_fader_bell, 6,18,0
  - sfx_fader_bell, 6,-18,0
  - vfx_offering, 0,0,-1
  - fx_GP_Player, 0,0,2
  - FallenValkyrie, valdraka, 0,-15,28, 3
  - vfx_troll_summoned_prespawn, 0,-15,32, 3
  - fx_fader_meteor_hit, 0,-15,8, 3
  - fx_fader_meteor_hit, 8,-10,7, 3
  - fx_fader_meteor_hit, -7,-10,10, 3
  - sfx_fallenvalkyrie_taunt, 0,-15,28, 3
  - sfx_fallenvalkyrie_taunt, 0,5,10, 3
  - sfx_valdraka_summon, 0,0,0, 4


# Lock bell upon hanging it
- prefab: fader_bellholder
  type: state, item Bell
  filter: string, Piece.m_name, bell_val
  data: isBellValdraka
  spawn:
  - prefab: vfx_Place_oven
    pos: 0,0,1
  - prefab: sfx_build_hammer_metal

# Loot drop
- prefab: FallenValkyrie
  type: destroy
  filter: string, Humanoid.m_name, "Valdraka" 
  spawn:
  - prefab: sfx_valdraka_death
    delay: 1
  - prefab: piece_chest
    data: loot_valdraka
    delay: 2
    triggerRules: true
  - prefab: fx_GP_Stone
    delay: 2
  - prefab: vfx_HearthAddFuel
    delay: 2
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 2
    2: vec, <pos>
    3: string, Treasure Dropped!
    4: bool, true
    delay: 2

# Loot drop removal aesthetic
- prefab: piece_chest
  type: destroy
  filter: string, Container.m_name, "Valkyrie's Treasure"
  spawn:
  - prefab: fx_GP_Stone
  - prefab: vfx_HearthAddFuel


