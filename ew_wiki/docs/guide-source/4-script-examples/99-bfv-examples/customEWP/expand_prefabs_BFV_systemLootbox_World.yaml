# ═══════════════════════════════════════════════════════════
# Spawner - Mountain
# ═══════════════════════════════════════════════════════════
# Frostner Lvl8 Debugging
- prefab: Player
  type: say, !frostner
  admin: true
  cancel: true
  spawn: vfx_spawn_small, 0,0,1
  poke:
  - prefab: Container
    maxDistance: 20000
    parameter: findContainer

- prefab: Container
  type: poke, findContainer
  poke:
  - self: true
    parameter: findFrostner <item_MaceSilver>

- prefab: Container
  type: poke, findFrostner 1;999
  exec: <save_frostner<zdo>_<pos>>

- prefab: sfx_secretfound
  type: create
  objects:
  - prefab: Spawner_Bat
    filter: int, worldlootspawner4, 1
