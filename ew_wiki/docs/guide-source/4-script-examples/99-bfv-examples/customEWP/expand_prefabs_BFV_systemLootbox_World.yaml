# ═══════════════════════════════════════════════════════════
# Spawner - Elderoot Mine
# ═══════════════════════════════════════════════════════════
- prefab: sfx_secretfound
  type: create
  objects:
  - prefab: Spawner_Blob
    filters:
    - int, elderoot_spawner2hr, 1
    - int, elderoot_spawner6hr, 1
    filterLimit: 1
    maxDistance: 1
  bannedObjects:
  - prefab: elderoot02
    maxDistance: 1
  swap:
  - prefab: elderoot02
    data: elderoot
    triggerRules: true
  spawn:
  - prefab: vfx_poisonarrow_hit

# ═══════════════════════════════════════════════════════════
# Custom drop from Elderoot
# ═══════════════════════════════════════════════════════════
- prefab: elderoot02
  type: destroy
  objects:
  - prefab: Player
    maxDistance: 15
  spawn:
  - prefab: RootElder2
  - prefab: vfx_poisonarrow_hit
  - prefab: sfx_eldenking_summon
    delay: 2
    chance: 0.05

