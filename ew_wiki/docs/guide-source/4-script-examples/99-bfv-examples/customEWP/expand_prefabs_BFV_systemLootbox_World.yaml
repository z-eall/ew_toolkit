# ═══════════════════════════════════════════════════════════
# Spawner - Meadows
# ═══════════════════════════════════════════════════════════
- prefab: sfx_secretfound
  type: create
  objects:
  - prefab: Spawner_Bat
    filter: int, worldlootspawner1, 1
    maxDistance: 1
  bannedObjects:
  - prefab: piece_chest_wood
    maxDistance: 1
  swap:
  - prefab: piece_chest_wood
    data: worldloot1
    triggerRules: true

