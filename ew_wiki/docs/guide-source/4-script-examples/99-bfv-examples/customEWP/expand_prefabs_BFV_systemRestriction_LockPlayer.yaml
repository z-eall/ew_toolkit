#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Faction Ward Permission                         ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
# Player command trigger
- prefab: Player
  type: say, !ward
  keys: <pid>/team
  poke:
  - prefab: <factionWardTeam<load_<pid>/team=0>>
    maxDistance: 30
    parameter: permitPlayerToFactionWard <long_playerID> <pname>

# Permit faction ward
- prefab: BetterWard_Type4, BetterWard_Type3
  type: poke, permitPlayerToFactionWard
  objectRpc:
  - name: ToggleEnabled
    1: long, <long_creator>
  - name: TogglePermitted
    1: long, <par_1>
    2: string, <rest_2>
    delay: 0.2
  - name: ToggleEnabled
    1: long, <long_creator>
    delay: 0.5

#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Player Restriction                              ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
# ═══════════════════════════════════════════════════════════
# Restricted weapons
# ═══════════════════════════════════════════════════════════
# Trigger debuff when equip
- prefab: Player
  types:
  - change, RightItem SwordNiedhoggBlood,THSwordSlayerBlood,SpearSplitner_Blood,AxeBerzerkrBlood,MaceEldnerBlood
  - change, LeftItem CrossbowRipperBlood,BowAshlandsBlood
  poke:
  - self: true
    parameter: NoWeapon
    
# Leader Staffs (Wolf)
- prefab: Player
  types:
  - change, RightItem StaffWolf
  bannedKeys: <pid>/teamlead 1
  poke:
  - self: true
    parameter: NoWeapon
    
# Leader Staffs (Dragon)
- prefab: Player
  types:
  - change, RightItem StaffDragon
  bannedKeys: <pid>/teamlead 2
  poke:
  - self: true
    parameter: NoWeapon

# Trigger debuff when equip near specific location
- prefab: Player
  types:
  - change, RightItem PickaxeAntler,PickaxeBronze,PickaxeIron,PickaxeBlackMetal
  objects:
  - prefab: metal_gate, ashen_gate
    maxDistance: 5
  - prefab: piece_siegestation
    maxDistance: 35
  objectsLimit: 1
  poke:
  - self: true
    parameter: NoWeapon

# Restricted Holding Sledge in Siegecamp zone
- prefab: Player
  types:
  - state, action *
  - state, resetcloth
  filters:
  - hash, RightItem, <pickaxes>
  - hash, RightItem, Hoe
  - hash, RightItem, SpearChitin
  filterLimit: 1
  objects:
  - prefab: piece_siegestation
    filter: int, isBfvSiegeCampPiece, 1
    maxDistance: 35
  - prefab: AshlandsTreeStump2
    filter: int, isRadarCity, 1;99
    maxDistance: 110
  objectsLimit: 1
  poke:
  - self: true
    parameter: NoTerraformingSiegeCamp

- prefab: Player
  types:
  - change, RightItem PickaxeAntler,PickaxeBronze,PickaxeIron,PickaxeBlackMetal
  - change, RightItem Hoe
  - change, RightItem SpearChitin
  objects:
  - prefab: piece_siegestation
    filter: int, isBfvSiegeCampPiece, 1
    maxDistance: 35
  - prefab: AshlandsTreeStump2
    filter: int, isRadarCity, 1;2
    maxDistance: 220
  - prefab: AshlandsTreeStump2
    filter: int, isRadarCity, 3;99
    maxDistance: 110
  objectsLimit: 1
  poke:
  - self: true
    parameter: NoTerraformingSiegeCamp

- prefab: Player
  type: poke, NoTerraformingSiegeCamp
  objectRpc:
  - name: RPC_Stagger
    1: vec, <a>
  - name: RPC_AddStatusEffect
    1: hash, Immobilized
    2: bool, true
    3: int, 1
    4: float, 1
  - name: UseStamina
    1: float, 200
  clientRpc:
  - name: ShowMessage
    1: enum_message, 2
    2: string, <#FF0000>Restricted near Siege Camp/Castle.
    
# Restricted Holding Sledge in Powerstone zone
- prefab: Player
  types:
  - state, action *
  - state, resetcloth
  filters:
  - hash, RightItem, <sledges>
  filterLimit: 1
  objects:
  - prefab: cauldron_ext3_butchertable
    filters:
    - int, isBfvPowerstone, -1
    - int, isBfvPowerstone, 1
    - int, isBfvPowerstone, 2
    filterLimit: 1
    maxDistance: 12
  poke:
  - self: true
    parameter: NoSledgeHere

- prefab: Player
  types:
  - change, RightItem SledgeStagbreaker,SledgeIron,SledgeElder,SledgeDemolisher,SledgeAnchor,SledgeWood
  objects:
  - prefab: cauldron_ext3_butchertable
    filters:
    - int, isBfvPowerstone, -1
    - int, isBfvPowerstone, 1
    - int, isBfvPowerstone, 2
    filterLimit: 1
    maxDistance: 12
  poke:
  - self: true
    parameter: NoSledgeHere

- prefab: Player
  type: poke, NoSledgeHere
  objectRpc:
  - name: RPC_Stagger
    1: vec, <a>
  - name: RPC_AddStatusEffect
    1: hash, Immobilized
    2: bool, true
    3: int, 1
    4: float, 1
  - name: UseStamina
    1: float, 200
  clientRpc:
  - name: ShowMessage
    1: enum_message, 2
    2: string, <#FF0000>No Sledge Here

# Debuff
- prefab: Player
  type: poke, NoWeapon
  objectRpc:
  - name: RPC_Stagger
    1: vec, <a>
  - name: RPC_AddStatusEffect
    1: hash, Immobilized
    2: bool, true
    3: int, 1
    4: float, 1
  - name: UseStamina
    1: float, 200
  clientRpc:
  - name: ShowMessage
    1: enum_message, 2
    2: string, <#FF0000>Restricted Weapon
    
 

# ═══════════════════════════════════════════════════════════
# Restricted lox rides
# ═══════════════════════════════════════════════════════════
- prefab: Lox
  type: state, step
  objects:
  - prefab: AshlandsTreeStump2
    filter: int, isRadarCity, 1;99
    maxDistance: 110
  - prefab: piece_siegestation
    filter: int, isBfvSiegeCampPiece, 1
    maxDistance: 35
  objectsLimit: 1
  remove: true
  spawn:
  - prefab: vfx_corpse_destruction_medium
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <x>,<z>,<add_1_<y>>
    3: string, Loxes are not allowed near castle.
    4: bool, true

# ═══════════════════════════════════════════════════════════
# Restricted Gullnapole
# ═══════════════════════════════════════════════════════════
- prefab: Fader_WallOfFire_AOE
  type: create
  objects:
  - prefab: metal_gate
    maxDistance: 2
  - prefab: ashen_gate
    maxDistance: 2
  - prefab: cauldron_ext3_butchertable
    filters:
    - int, isBfvPowerstone, -1
    - int, isBfvPowerstone, 1
    - int, isBfvPowerstone, 2
    filterLimit: 1
    maxDistance: 2
  objectsLimit: 1
  remove: true

# ═══════════════════════════════════════════════════════════
# Restricted Trollstav
# ═══════════════════════════════════════════════════════════
- prefab: Troll_Summoned
  type: create
  bannedFilter: int, firstSummoned, 1
  bannedObjects:
  - prefab: <prefab>
    maxDistance: 100
  data: int, firstSummoned, 1

- prefab: Troll_Summoned
  types:
  - create
  - state, step
  poke:
  - self: true
    delay: 0.1
    parameter: checkRedTrollCondition

- prefab: Troll_Summoned
  type: poke, checkRedTrollCondition
  bannedFilter: int, firstSummoned, 1
  objects:
  - prefab: <prefab>
    maxDistance: 100
  remove: true
  spawn:
  - prefab: vfx_troll_summoned_death
  - prefab: fx_TrollUndead_Gibs
  - prefab: sfx_trollfire_death
  clientRpc:
  - name: ShowMessage
    1: enum_message, 2
    2: string, A mystical force tears the Red Troll back into the void.

- prefab: Troll_Summoned
  type: poke, checkRedTrollCondition
  objects:
  - prefab: siege_wall_1x1
    filter: string, Piece.m_name, cubeTrollLock100
    maxDistance: 100
  remove: true
  spawn:
  - prefab: vfx_troll_summoned_death
  - prefab: fx_TrollUndead_Gibs
  - prefab: sfx_trollfire_death
  clientRpc:
  - name: ShowMessage
    1: enum_message, 2
    2: string, A mystical force tears the Red Troll back into the void.

# ═══════════════════════════════════════════════════════════
# Restricted jump near Ashlands Fortress
# ═══════════════════════════════════════════════════════════
# Restrict double jump or 2-layers jumping near CharredFortress
# Save player pos on first jump near CharredFortress
- prefab: Player
  type: change, $onGround 0
  maxY: <add_4_<snap>> # Detect player jumping from ground
  locations: CharredFortress
  locationDistance: 32
  exec: <save_<long_playerID>jumppos_<pos>>

# Reset jump count when player on ground
- prefab: Player
  type: change, $onGround 1
  maxY: <add_4_<snap>> # Detect player landed on real ground
  locations: CharredFortress
  locationDistance: 32
  exec: <clear_<long_playerID>jumpcount>

# Add jumpCount every time player jump around the fortress
- prefab: Player
  type: state, jump
  locations: CharredFortress
  locationDistance: 32
  bannedObjects: # Make safety to jump on the walls/stairs
  - prefab: Ashlands_Wall_2x2_top
    maxHeight: 2
    maxDistance: 1
  - prefab: Ashland_Stair
    maxHeight: 2
    maxDistance: 2
  bannedObjectsLimit: 1
  exec: <save++_<long_playerID>jumpcount>
  poke:
  - self: true
    parameter: detectDoubleJump <load_<long_playerID>jumpcount=0>

# To pull them back to saved pos when double jump detected
- prefab: Player
  type: poke, detectDoubleJump 2;10 # Trigger whenever jumpCount >=2
  weight: 1e30
  exec: <clear_<long_playerID>jumpcount>
  objectRpc: # Teleport to saved pos
  - name: RPC_TeleportTo
    1: vec, <load_<long_playerID>jumppos>
    2: quat, <a>
    3: bool, 2
    delay: 0.1
  clientRpc: # Print warning message
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <x>,<z>,<add_1_<y>>
    3: string, Nope!
    4: bool, true
    delay: 0.2

# Clear player jumpPos when exit CharredFortress range
- prefab: Player
  type: change, $onGround 0
  bannedLocations: CharredFortress
  locationDistance: 32
  exec: <clear_<long_playerID>jumppos>

