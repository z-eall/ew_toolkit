- type: realtime, minute 50 7
  commands:
  - s Server daily restart in 10 minutes.
  - s Please move to a safe location and log out manually to avoid any potential rollback or loss of progress.
  - s You may log back in few minutes after the restart.

- type: realtime, minute 55 7
  commands:
  - s Server daily restart in 5 minutes.
  - s Please move to a safe location and log out manually to avoid any potential rollback or loss of progress.
  - s You may log back in few minutes after the restart.

- type: realtime, minute 57 7
  commands:
  - s Server daily restart in 3 minutes.
  - s Please move to a safe location and log out manually to avoid any potential rollback or loss of progress.
  - s You may log back in few minutes after the restart.

- type: realtime, minute 59 7
  commands:
  - s Server daily restart in 1 minute.
  - s Please move to a safe location and log out manually to avoid any potential rollback or loss of progress.
  - s You may log back in few minutes after the restart.

#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - In-game Day/Night Cycle                         ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
- type: time, minute 24;59 20
  bannedGlobalKeys: nighttime
  commands:
  - removekey daytime
  - setkey nighttime

- type: time, minute 36;59 03
  bannedGlobalKeys: daytime
  commands:
  - removekey nighttime
  - setkey daytime

#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Admin Debug                                     ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
# Eikthyr: -316818231
# Elder: 1828406738
# Bonemass: -146537656
# Moder: 1225607547
# Yagluth: -221799126
# Queen: dungeon_queen_door (change key)
# Fader: -201398907

- prefab: Player
  type: say, !realday
  # commands:
  # - s Server day count is adjusted to <par_1>.
  admin: true
  cancel: true
  exec: <save_bfvrealday_<par_1>>
  objectRpc:
  - name: Message
    1: enum_message, 2
    2: string, Server day count is adjusted to <load_bfvrealday=0>.
    3: int, 1

- prefab: Player
  type: say, !serverutc
  # commands:
  # - s Server UTC is adjusted to <par_1>.
  admin: true
  cancel: true
  exec: <save_serverutc_<par_1>>
  objectRpc:
  - name: Message
    1: enum_message, 2
    2: string, Server UTC is adjusted to <load_serverutc=0>.
    3: int, 1

# Player command
- prefab: Player
  type: say, !time
  objectRpc:
  - name: Message
    1: enum_message, 2
    2: string, <msgPlayerCheckTime>
    3: int, 1
    repeat: 3
    repeatInterval: 1
    overwrite: true