#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Minerock - Ore                                  ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
# ═══════════════════════════════════════════════════════════
# Minerock - Copper
# ═══════════════════════════════════════════════════════════
- prefab: fx_QueenPierceGround
  type: create
  objects:
  - prefab: Spawner_Bat
    filter: int, copperspawner, 1
    maxDistance: 1
  bannedObjects:
  - prefab: MineRock_Copper
    maxDistance: 2
  swap:
  - prefab: MineRock_Copper
    rot: 0,0,0

