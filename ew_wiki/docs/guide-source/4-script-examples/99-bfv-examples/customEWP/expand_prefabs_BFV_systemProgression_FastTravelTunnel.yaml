#
# ═══════════════════════════════════════════════════════════
# EASTPASS
# ═══════════════════════════════════════════════════════════
- prefab: sfx_dverger_footsteps
  type: create
  objects:
  - prefab: rug_straw
    filter: int, PieceEastpass, 1
    maxDistance: 10
  commands:
  - s THE EASTPASS TUNNEL IS NOW OPEN!
  - s Players can now fast travel between Albinar Village and Bloodstone Hold.
  - broadcast center THE EASTPASS TUNNEL IS NOW OPEN!
  - setkey eastpass_true
  poke:
  - prefab: ashwood_wall_cross_45_alt
    filter: int, CrossEastpass, 1
    maxDistance: 10
    parameter: removeTunnelCross

- prefab: ashwood_wall_cross_45_alt  
  type: poke, removeTunnelCross
  remove: true

