# GENERAL - ABOMINATION
# ═══════════════════════════════════════════════════════════
# Loot drop
# Level 2 = 4 Roots
# Level 3 = 8 Roots
# Level 4 = 12 Roots
- prefab: Abomination
  type: destroy
  filters:
  - int, level, 2
  - int, level, 3
  - int, level, 4
  filterLimit: 1
  spawn:
  - prefab: Root
    data: int, stack, <mul_4_<sub_<int_level=1>_1>>
    delay: 8 # Abom ragdoll has 8s ttl
    
# ═══════════════════════════════════════════════════════════
# GENERAL - CREATURE - ABYSSAL DREAD
# ═══════════════════════════════════════════════════════════

- prefab: Serpent
  type: create
  weight: 0.05
  bannedObjects:
  - prefab: Serpent
    maxDistance: 1
  swap:
  - prefab: Serpent
    data: abyssalserpent
    triggerRules: true

