# ═══════════════════════════════════════════════════════════
# Admin override control
# ═══════════════════════════════════════════════════════════
# Changing gate state
- prefab: Player
  type: say, !drawbridge 1,0
  admin: true
  cancel: true
  poke:
  - prefab: wood_wall_log_4x0.5
    maxDistance: 5
    filter: string, Piece.m_name, DrawbridgeCenter
    parameter: changeDrawbridgeState <par_1>

# ═══════════════════════════════════════════════════════════
# NPC trigger
# ═══════════════════════════════════════════════════════════
# Check if owned castle mismtach Player team
- prefab: sfx_charred_twitcher_throw, sfx_charred_twitcher_throw_impact
  type: create
  weight: 1e30
  objects:
  - prefab: MarketPlaceNPC
    filters:
    - string, KGnpcDialogue, wh_bridge
    - string, KGnpcDialogue, wh_bridge_up
    filterLimit: 1
    maxDistance: 10
  bannedObjects:
  - prefab: AshlandsTreeStump2
    filter: int, isCapturedByTeam, <load_<pid>/team=-1>
    maxDistance: 200
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <x>,<z>,<add_1_<y>>
    3: string, Your faction doesn't own this place
    4: bool, true

# Changing gate state
- prefab: sfx_charred_twitcher_throw, sfx_charred_twitcher_throw_impact
  type: create
  fallback: true
  objects:
  - prefab: MarketPlaceNPC
    filters:
    - string, KGnpcDialogue, wh_bridge
    - string, KGnpcDialogue, wh_bridge_up
    filterLimit: 1
    maxDistance: 10
  poke:
  - prefab: wood_wall_log_4x0.5
    limit: 1
    filter: string, Piece.m_name, DrawbridgeCenter
    parameter: changeDrawbridgeState <bridgeState/<prefab>>

- prefab: wood_wall_log_4x0.5
  type: poke, changeDrawbridgeState
  data: int, drawbridgeState, <par_1>
  triggerRules: true

