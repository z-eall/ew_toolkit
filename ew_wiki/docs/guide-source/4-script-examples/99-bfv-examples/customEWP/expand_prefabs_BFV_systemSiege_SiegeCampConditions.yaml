#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - BFV Siege Camp Conditions                       ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝


# ═══════════════════════════════════════════════════════════
# Check siege camp conditions before spawn
# ═══════════════════════════════════════════════════════════
- prefab: siegecamp_wood, siegecamp_mini, siegecamp_dverger, siegecamp_stone
  type: create
  poke:
  - self: true
    delay: 0.1
    parameter: checkSiegeCampSpawnCondition

- prefab: siegecamp_wood, siegecamp_mini, siegecamp_dverger, siegecamp_stone
  type: poke, checkSiegeCampSpawnCondition
  bannedKeys: adminmode 1
  bannedObjects:
  - prefab: goblin_trashpile
    filter: int, isSiegeCampCenter, 1
    maxDistance: 3
  drops: true
  remove: true
  spawn:
  - prefab: fx_guardstone_permitted_removed
    pos: 0,0,1
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <x>,<z>,<add_1_<y>>
    3: string, Must be at a siege camp location
    4: bool, true
    
- prefab: siegecamp_wood, siegecamp_mini, siegecamp_dverger, siegecamp_stone
  type: poke, checkSiegeCampSpawnCondition
  bannedKeys: adminmode 1
  objects:
  - prefab: AshlandsTreeStump2
    filter: int, isCapturedByTeam, <load_<pid>/team=-1>
    maxDistance: 300
  drops: true
  remove: true
  spawn:
  - prefab: fx_guardstone_permitted_removed
    pos: 0,0,1
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <x>,<z>,<add_1_<y>>
    3: string, Can't build near owned castle
    4: bool, true
       
#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - BFV Siege Camp - TNT                            ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
- prefab: piece_siegestation
  type: destroy
  commands:
  - s A Siege Camp has been broken!
  filter: int, isBfvSiegeCampPiece, 1
  # bannedKeys: adminmode 1
  spawn:
  - prefab: fermenter
    data: isBfvSiegeCampTNT
    rot: 180,0,0
    delay: 15
    triggerRules: true
  - prefab: vfx_Place_charcoalkiln
    delay: 15
  - prefab: sfx_build_hammer_wood
    delay: 15
  poke:
  - prefab: Player
    maxDistance: 250
    parameter: printMsgSiegeCampBroken

- prefab: Player
  type: poke, printMsgSiegeCampBroken
  objectRpc:
  - name: Message
    1: enum_message, 2
    2: string, A Siege Camp has been broken!
    3: int, 1
    overwrite: true
    repeat: 2
    repeatInterval: 1
  spawns:
  - sfx_siegecamp_destroyed, 0,0,0, 1

- prefab: fermenter
  type: destroy
  filter: int, isBfvSiegeCampTNT, 1
  bannedKeys: adminmode 1
  spawn:
  - prefab: fx_fireball_staff_explosion
    pos: 0,0,1
    delay: 2
  - prefab: vfx_troll_rock_destroyed
    pos: 0,0,1
    delay: 2
  - prefab: fx_shaman_fireball_expl
    pos: 0,0,1
    delay: 3
  - prefab: fx_fireskeleton_nova
    delay: 2.5
  - prefab: DvergerStaffFire_fire_aoe
    delay: 5
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <pos>
    3: string, 5...
    4: bool, false
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <pos>
    3: string, 4..
    4: bool, false
    delay: 1
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <pos>
    3: string, 3..!
    4: bool, false
    delay: 2
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <pos>
    3: string, 2..!!
    4: bool, false
    delay: 3
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <pos>
    3: string, 1!!!
    4: bool, false
    delay: 4
  poke:
  - prefab: Piece, LocationProxy
    filter: int, isBfvSiegeCampPiece, 1
    delay: 5
    maxDistance: 30
    parameter: removeSiegeCamp

- prefab: Piece, LocationProxy
  type: poke, removeSiegeCamp
  poke:
  - self: true
    delay: <randf_0_7>
    parameter: delaySiegeCampEffect

- prefab: Piece, LocationProxy
  type: poke, delaySiegeCampEffect
  filter: int, isBfvSiegeCampPiece, 1
  remove: true
  triggerRules: true
  # spawn:
  # - prefab: randomSiegeCampTNTEffect
  # objectRpc:
  # - name: RPC_CreateFragments
    # target: all
    
    
