  bannedFilters:
  - int, isBfvSiegeCampPiece, 1
  - int, pickedUp, 1
  bannedKeys: adminmode 1
  objects:
  - prefab: piece_siegestation
    filter: int, isBfvSiegeCampPiece, 1
    maxDistance: 50
  remove: true
  drops: true
  delay: 0.2
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <x>,<z>,<add_1_<y>>
    3: string, Can't build this near a Siege Camp
    4: bool, true
    
    
  
  