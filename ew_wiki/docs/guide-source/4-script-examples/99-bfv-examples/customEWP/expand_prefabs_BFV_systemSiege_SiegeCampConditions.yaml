# Remove Placeholder when Camp is Deployed
- prefab: piece_siegestation
  type: create
  filter: int, isBfvSiegeCampPiece, 1
  poke:
  - prefab: stone_wall_1x1, stone_wall_2x1, stake_wall, CharredBanner2, fire_pit, Rock_4
    maxDistance: 50
    filter: int, isSiegeCampPiece, 1
    parameter: RemoveCampPlaceholder
  - prefab: goblin_trashpile
    limit: 1
    maxDistance: 50
    filter: int, isSiegeCampPiece, 1
    parameter: sinkCampPlaceholderCenter
    
- prefab: stone_wall_1x1, stone_wall_2x1, stake_wall, CharredBanner2, fire_pit, Rock_4
  type: poke, RemoveCampPlaceholder
  remove: true
    
- prefab: goblin_trashpile
  type: poke, sinkCampPlaceholderCenter    
  swap:
  - prefab: <prefab>
    pos: 0,0,-30
  
# Respawn Placeholder when a Camp is Destroyed
  
- prefab: LocationProxy
  type: destroy
  filter: int, isBfvSiegeCampPiece, 1
  poke:
  - prefab: goblin_trashpile
    filter: int, isSiegeCampPiece, 1
    limit: 1
    maxDistance: 50
    minHeight: 20
    delay: 0.1
    parameter: raiseCampPlaceholderCenter

- prefab: goblin_trashpile
  type: poke, raiseCampPlaceholderCenter
  swap:
  - prefab: <prefab>
    pos: 0,0,30
    data: float, siegeCampCooldown, <time>
    triggerRules: true

