# ║ Section - BFV Siege Camp - Build Restriction              ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝

# Nobuild in Camp Ruins (Placeholder)
- prefab: Piece
  excludePrefab: siegecamp_mini, siegecamp_wood, siegecamp_stone, siegecamp_dverger, piece_siegestation, BatteringRam, BatteringRamBM, BatteringRamBronze, Catapult, CatapultIron, CatapultSilver, fermenter, BetterWard_Type4, BetterWard_Type3
  type: create
  bannedFilters:
  - int, isBfvSiegeCampPiece, 1
  - int, pickedUp, 1
  bannedKeys: adminmode 1
  objects:
  - prefab: goblin_trashpile
    filter: int, isSiegeCampCenter, 1
    maxDistance: 50
    maxHeight: 10
  remove: true
  drops: true
  delay: 0.2
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <x>,<z>,<add_1_<y>>
    3: string, Can't build this here
    4: bool, true

# Nobuild in Siege Camp
- prefab: Piece
  excludePrefab: piece_sharpstakes, piece_stakewall_blackwood, piece_dvergr_sharpstakes, piece_trap_troll, piece_turret, BatteringRam, BatteringRamBM, BatteringRamBronze, Catapult, CatapultIron, CatapultSilver, fire_pit, bonfire, BetterWard_Type4, BetterWard_Type3, fermenter, piece_siegestation, Karve, Raft, VikingShip, VikingShip_Ashlands, Snekke, Holk, Knarr, wolftotem, dragontotem, wolfemblem, dragonemblem, goblin_trashpile
