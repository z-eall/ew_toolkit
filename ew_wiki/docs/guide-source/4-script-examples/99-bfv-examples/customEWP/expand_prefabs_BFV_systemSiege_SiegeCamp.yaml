#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - BFV Siege Camp                                  ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#

- prefab: siegecamp_wood, siegecamp_mini, siegecamp_dverger, siegecamp_stone
  type: poke, checkSiegeCampSpawnCondition
  fallback: true
  swap:
  - prefab: <prefab>
    # snap: true
    data: resetSiegeCampRotation
  poke:
  - prefab: goblin_trashpile
    filter: int, isSiegeCampCenter, 1
    maxDistance: 3
    delay: 0.25
    parameter: findSiegeCampCenter <prefab>

- prefab: goblin_trashpile
  type: poke, findSiegeCampCenter
  poke:
  - prefab: <par_1>
    limit: 1
    maxDistance: 3
    delay: 0.25
    parameter: checkSiegeCampCooldown <ge_<sub_<time>_<float_siegeCampCooldown=0>>_<cooldownForCamp>> <float_siegeCampCooldown=0> # cooldownCalc, cooldownFloat
    
- prefab: siegecamp_wood, siegecamp_mini, siegecamp_dverger, siegecamp_stone
  type: poke, checkSiegeCampCooldown false
  weight: 1e30
  bannedKeys: adminmode 1
  drops: true
  remove: true
  spawn:
  - prefab: fx_guardstone_permitted_removed
    pos: 0,0,1
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <x>,<z>,<add_1_<y>>
    3: string, Cooling down for <ceil_<div_<sub_<cooldownForCamp>_<sub_<time>_<par_2=0>>>_60>> minutes
    4: bool, true

### HP
# WOODEN: WALLSGATES 10K | CRAFTING 3K | TOPFLOOR,BEDS 4K
# MINI: ALL 2K
# STONE: GATES DEFAULT | WALLS,BUILDINGS 30K
# DVERGER: GATES/WALLS DEFAULT (ONLY RAM DMG) | CRAFTING 15K | BUILDING,BEDS 15K
#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - BFV Siege Camp - Wooden                         ║
