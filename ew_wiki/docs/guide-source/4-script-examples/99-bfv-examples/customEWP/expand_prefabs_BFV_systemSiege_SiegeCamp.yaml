  type: poke, checkSiegeCampCooldown true
  fallback: true
  bannedKeys: <pid>/teamlead
  drops: true
  remove: true
  spawn:
  - prefab: fx_guardstone_permitted_removed
    pos: 0,0,1
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    1: enum_damagetext, 7
    2: vec, <x>,<z>,<add_1_<y>>
    3: string, You are not in leadership role.
    4: bool, true
  
