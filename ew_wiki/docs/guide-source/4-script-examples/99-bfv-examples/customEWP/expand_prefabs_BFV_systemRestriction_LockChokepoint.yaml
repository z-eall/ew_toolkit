# ═══════════════════════════════════════════════════════════
# Restricted castle gate distance
# ═══════════════════════════════════════════════════════════
- prefab: metal_gate, ashen_gate
  type: poke, checkBuildCondition
  weight: 1e30
  bannedKeys: adminmode 1
  bannedFilters:
  - int, isBfvSiegeCampPiece, 1
  bannedObjects:
  # - prefab: wood_beam_1 # Old piece used
    # filter: string, Piece.m_name, castle_piece
    # maxDistance: 70
  - prefab: AshlandsTreeStump2 # New standardised piece
    filter: int, isRadarCity, 1;99
    maxDistance: 70
  bannedObjectsLimit: 1
  remove: true
  drops: true
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <x>,<z>,<add_1_<y>>
    3: string, Gate too far from a castle.
    4: bool, true