# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Lootbox - Lumber                                ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
# ═══════════════════════════════════════════════════════════
# Spawner - Lootbox - T1 Lumber
# ═══════════════════════════════════════════════════════════
# Black Forest
- prefab: sfx_secretfound
  type: create
  objects:
  - prefab: Spawner_Bat
    filter: int, lumberlootspawner1, 1
    maxDistance: 1
  bannedObjects:
  - prefab: piece_chest_wood
    maxDistance: 1
  swap:
  - prefab: piece_chest_wood
    data: lumberloot1
    triggerRules: true

# ═══════════════════════════════════════════════════════════
# Spawner - Lootbox - T2 Lumber
# ═══════════════════════════════════════════════════════════
# Swamp
- prefab: sfx_secretfound
  type: create
  objects:
  - prefab: Spawner_Bat
    filter: int, lumberlootspawner2, 1
    maxDistance: 1
  bannedObjects:
  - prefab: piece_chest_wood
    maxDistance: 1
  swap:
  - prefab: piece_chest_wood
    data: lumberloot2
    triggerRules: true

#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Lootbox Despawn Aesthetic                       ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
- prefab: piece_chest_wood
  type: destroy
  filter: int, chestnumba, 11;12
  spawn:
  - prefab: vfx_BugRepellent

