#
# ═══════════════════════════════════════════════════════════
# Spawner - Lootbox - T0 Farm
# ═══════════════════════════════════════════════════════════
# Base
- prefab: sfx_secretfound
  type: create
  objects:
  - prefab: Spawner_Bat
    filter: int, baselootspawner, 1
    maxDistance: 1
  bannedObjects:
  - prefab: piece_chest_wood
    maxDistance: 1
  swap:
  - prefab: piece_chest_wood
    data: baseloot
    rot: 0,0,0
    triggerRules: true

