#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Lootbox Despawn Aesthetic                       ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
- prefab: piece_chest_wood, piece_chest_barrel
  type: destroy
  filters:
  - int, chestnumba, 1;10
  - int, chestnumba, 99
  filterLimit: 1
  spawn:
  - prefab: vfx_BugRepellent

