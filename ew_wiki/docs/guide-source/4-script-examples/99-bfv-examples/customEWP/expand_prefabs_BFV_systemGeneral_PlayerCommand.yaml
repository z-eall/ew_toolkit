# ═══════════════════════════════════════════════════════════
# Player SOS
# ═══════════════════════════════════════════════════════════
# ADMIN HELP
- prefab: Player
  type: say, !sos
  poke:
  - prefab: Player
    maxDistance: 20000
    parameter: findAdmin <ge_<floor_<sub_<time>_<load_<pid>/soscooldown=0>>>_30> <pid> <pname> # sosCooldown, playerPID, playerName

- prefab: Player
  type: poke, findAdmin true
  admin: true
  exec: |
    <save_<par_2>/soscooldown_<time>>
  clientRpc:
  - name: ShowMessage
    1: enum_message, 2
    2: string, <size=35><#00ffff><pname><#ddd>, <#fff000><rest_3><#ddd> is seeking help!
    repeat: 9
    repeatInterval: 1
    overwrite: true

# ═══════════════════════════════════════════════════════════
# Player Command List
# ═══════════════════════════════════════════════════════════
- prefab: Player
  type: say, !help
  poke:
  - self: true
    repeat: 9
    repeatInterval: 1
    parameter: printPlayerHelpMenu

- prefab: Player
  type: poke, printPlayerHelpMenu
  objectRpc:
  - name: Message
    1: enum_message, 2
    2: string, <msgPlayerHelp>
    3: int, 1
    overwrite: true
  

# ═══════════════════════════════════════════════════════════
# Officer Horn
# ═══════════════════════════════════════════════════════════
- prefab: Player
  type: say, !horn
  cancel: true
  keys: <pid>/teamlead
  poke:
  - prefab: Player
    self: true
    maxDistance: 20000
    pars: findFactionMember, <rest_1>, <pid>, <pname> # hornMessage, officerPID, officerName

- prefab: Player
  type: poke, findFactionMember
  keys: <pid>/team <load_<par_2>/team=0>
  objectRpc:
  - name: Message
    1: enum_message, 2
    2: string, <#ddd><color<BfvTeam<load_<par_2>/team=0>>>Officer <par_3></color>:<br> <par_1>
    3: int, 1
    repeat: 9
    repeatInterval: 1
    overwrite: true

# ═══════════════════════════════════════════════════════════
# Officer Scout
# ═══════════════════════════════════════════════════════════
- prefab: Player
  type: say, !scout
  cancel: true
  keys: <pid>/teamlead
  exec: |
    <clear_*onlineplayer>
  poke:
  - prefab: Player
    self: true
    maxDistance: 20000
    delay: 0.1
    pars: countAllOnlinePlayer
  # - prefab: Player
    # self: true
    # maxDistance: 20000
    # delay: 0.25
    # pars: findFactionOfficers, <pname>, <pid>, <load_<pid>/team=0> # officerName, officerPID, officerTeam
  - self: true
    delay: 0.25
    pars: findFactionOfficers, <pname>, <pid>, <load_<pid>/team=0> # officerName, officerPID, officerTeam

- prefab: Player
  type: poke, countAllOnlinePlayer
  keys: <pid>/team
  exec: |
    <save++_<BfvTeam<load_<pid>/team=-1>>onlineplayer>

- prefab: Player
  type: poke, findFactionOfficers
  keys: <pid>/teamlead <par_3>
  objectRpc:
  - name: Message
    1: enum_message, 2
    2: string, <msgOfficerScout_truce<eq_1_<load_truceday=0>>>
    3: int, 1
    repeat: 9
    repeatInterval: 1
    overwrite: true