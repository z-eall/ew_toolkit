  - vfx_mistlands_mist, 50,-8,22
  - vfx_mistlands_mist, -20,0,24
  - vfx_mistlands_mist, -30,10,24
  - vfx_prespawn_fader, 0,0,-4, true
  - sfx_unstablerock_explosion, 0,0,10, 13
  - sfx_unstablerock_explosion, 0,0,10, 14
  - sfx_unstablerock_explosion, 0,0,10, 15
