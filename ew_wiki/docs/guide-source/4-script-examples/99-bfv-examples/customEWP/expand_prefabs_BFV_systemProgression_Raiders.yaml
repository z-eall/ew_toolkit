# Remove loot drops while neutral

# Felgar

- prefab: SurtlingCore, Coal, CharredBone
  type: create
  objects:
  - prefab: wood_pole
    filter: string, Piece.m_name, PieceFelgar
    maxDistance: 80
  - prefab: MountainKit_brazier_purple
    maxDistance: 80
  remove: true
  
# Brennvik
  
- prefab: CharredBone
  type: create
  objects:
  - prefab: wood_pole
    filter: string, Piece.m_name, PieceBrennvik
    maxDistance: 80
  - prefab: MountainKit_brazier_purple
    maxDistance: 80
  remove: true
