# Banegard City Capture Event
# ═══════════════════════════════════════════════════════════
#
# Apply key - buglord
- prefab: vfx_shieldgenerator_refuel
  type: create
  objects:
  - prefab: MarketPlaceNPC
    filter: string, KGnpcDialogue, buglord
    maxDistance: 10
  exec: <save_<pid>/buglord_1>
  
## Event Start
# 4 Player limit
- prefab: Player
  type: say, UNLEASH THE BROOD!
  keys: <pid>/buglord 1
  objects:
  - prefab: wood_pole
    filter: string, Piece.m_name, PieceBGNeutral
    maxDistance: 15
    weight: 20
  - prefab: Player
    maxDistance: 15
    weight: 1
  objectsLimit: 24
  commands:
  - s <pname> HAS SUMMONED THE BROOD! THE BUG ARMY IS BEING UNLEASHED ON BANEGARD CITY!
  spawns:
  - sfx_fader_death_explosion, 0,0,10, 6
  - sfx_gjall_alerted, 0,0,10, 2
  - sfx_gjall_alerted, 10,0,10, 5
