# Aggroed Dvergers

- prefab: wood_pole
  type: poke, triggerBugInvasion
  delay: 2
  poke:
  - prefab: Dverger, DvergerMageSupport, DvergerMageIce
    maxDistance: 100
    filter: int, BG_DvergerTamed, 1
    parameter: SwapDvergerBG
    
- prefab: Dverger
  type: poke, SwapDvergerBG
  swap:
  - prefab: Dverger
    data: BG_DvergerHostileRogue
  spawns:
  - fx_crystal_destruction
        
- prefab: DvergerMageSupport
  type: poke, SwapDvergerBG
  swap:
  - prefab: DvergerMageSupport
    data: BG_DvergerHostileMage
  spawns:
  - fx_crystal_destruction
    
- prefab: DvergerMageIce
  type: poke, SwapDvergerBG
  swap:
  - prefab: DvergerMageIce
    data: BG_DvergerHostileMage
  spawns:
  - fx_crystal_destruction
    
# Dverger Boss Spawn

- prefab: wood_pole
  type: poke, triggerBugInvasion
  poke:
  - prefab: blackmarble_stair
    filter: string, Piece.m_name, BGThroneStair
    maxDistance: 50
    parameter: spawnBGBoss
    
- prefab: blackmarble_stair
  type: poke, spawnBGBoss
  spawns:
  - DvergerMageFire, BG_DvergerHostileBoss
  poke:
  - prefab: MarketPlaceNPC
    filter: string, KGnpcDialogue, banegard_lord
    maxDistance: 50
    parameter: removeBGLord
    
- prefab: DvergerMageFire
  type: state, action *
  filter: string, Humanoid.m_name, Ironbeard
  spawn:
  - prefab: Mistile
    chance: 0.2
    data: int, aggravated, 1

# Remove Boss NPC

- prefab: MarketPlaceNPC
  type: poke, removeBGLord
  remove: true
  poke:
  - prefab: MarketPlaceNPC
    filter: string, KGnpcDialogue, banegard_pet
    maxDistance: 50
    parameter: removeBGPet
    
- prefab: MarketPlaceNPC
  type: poke, removeBGPet
  remove: true
  
# Boss Defeated

- prefab: DvergerMageFire
  type: destroy
  filter: string, Humanoid.m_name, Ironbeard
  delay: 2
  commands:
  - s THE LORD OF BANEGARD HAS BEEN DEFEATED! BANEGARD IS FREE!
  poke:
  - prefab: blackmarble_floor_large, dverger_guardstone, vfx_mistlands_mist
    maxDistance: 90
    parameter: removeBGRoom
  spawns:
  - fx_shieldgenerator_attack, 0,0,20
  - fx_shieldgenerator_attack, 0,0,-10
    
- prefab: blackmarble_floor_large, dverger_guardstone, vfx_mistlands_mist
  type: poke, removeBGRoom
  delay: 5
  remove: true
  spawns:
  - fx_crystal_destruction
  - vfx_Place_cauldron
    


    
    
  