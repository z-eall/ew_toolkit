# KALDHEIM - HAILMOTHER
# ═══════════════════════════════════════════════════════════
# Spawn from itemstand
- prefab: itemstandh
  type: state, item HailCrystal
  filter: string, Piece.m_name, standhailmother
  data: standhailmother
  spawn:
  - prefab: Hatchling
    data: hailmother
    pos: 0,0,18
  - prefab: fx_crystal_destruction
  - prefab: sfx_dragon_alerted

# Loot drop
- prefab: Hatchling
  type: destroy
  filter: string, Humanoid.m_name, Hailmother
  spawn:
  - prefab: CapeHail1
    data: hailmotherloot
    delay: 1