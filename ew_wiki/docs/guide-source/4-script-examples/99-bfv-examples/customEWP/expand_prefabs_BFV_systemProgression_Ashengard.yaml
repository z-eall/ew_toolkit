# ═══════════════════════════════════════════════════════════
# AESTHETIC EFFECTS UPON ASHENGARD GATE OPEN
# ═══════════════════════════════════════════════════════════
- prefab: dungeon_queen_door_custom
  type: change, state true
  delay: 18
  spawns:
  - fx_CharredStone_Destruction
  - fx_CharredStone_Destruction, 0,0,6
  - fx_CharredStone_Destruction, 2,0,4
  - fx_CharredStone_Destruction, 0,2,5
  - fx_DvergerMage_Fire_hit, 0,2,8
  - fx_DvergerMage_Fire_hit, 1,2,9
  - sfx_fader_death_start
  - sfx_dragon_death, 12,0,8
  - sfx_gjall_alerted, 0,0,8
  commands:
  - s THE GATES OF ASHENGARD ARE BEING OPENED...
  - broadcast center ;
  - wait 2000; broadcast center The gates of Ashengard are being opened...
  - wait 28000;broadcast center The path into the citadel is now clear.

# ═══════════════════════════════════════════════════════════
# BONE REMOVAL NEAR ASHENGARD GATE
# ═══════════════════════════════════════════════════════════
- prefab: CharredBone
  type: create
  objects:
  - prefab: Ashlands_Fortress_Gate_Door
    filter: string, Piece.m_name, ashenexit
    maxDistance: 100
  remove: true

# ═══════════════════════════════════════════════════════════
# Open Ashengard prison door
# ═══════════════════════════════════════════════════════════
- prefab: piece_groundtorch_green
  type: change, fuel 48;50
  filter: string, Fireplace.m_name, Ashenflame
  remove: true
  spawn:
  - prefab: fx_guardstone_permitted_add
  - prefab: vfx_crossbow_nature_fire
  poke:
  - prefab: dvergrtown_slidingdoor
    maxDistance: 15
    filter: string, Door.m_name, "Ashengard Prison"
    parameter: openPrison

- prefab: dvergrtown_slidingdoor
  type: poke, openPrison
  data: int, state, 1
  spawn:
  - prefab: vfx_Place_darkwood_gate
  - prefab: sfx_catapult_legs_down
  - prefab: fx_DvergerMage_Mistile_die
  - prefab: sfx_fader_bell
  commands:
  - wait 1500;broadcast center <color=#82e8a4>Ashengard Prison has been breached!
  - wait 3000;broadcast center <color=#82e8a4>Ashengard Prison has been breached!

# Print message upon Player spelled the passcode right
- prefab: Player
  type: say, RUNA VAKNA!
  objects:
  - prefab: forge_ext6
    filter: string, Piece.m_name, ashenprisoner
    maxDistance: 8
    maxHeight: 4
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 4
    2: vec, <x>,<z>,<add_1_<y>>
    3: string, Spell is correct!
    4: bool, true

# Print message upon Player spelled the passcode right
- prefab: Player
  type: say, RUNA VAKNA!
  objects:
  - prefab: Ashlands_Fortress_Gate_Door
    filter: string, Piece.m_name, ashenexit
    maxDistance: 4
    maxHeight: 5
  poke:
  - prefab: Ashlands_Fortress_Gate_Door
    filter: string, Piece.m_name, ashenexit
    parameter: ashenExit
    
- prefab: Ashlands_Fortress_Gate_Door
  type: poke, ashenExit
  spawns:
  - sfx_fader_fissure_footslide
  - fx_Fader_Fissure_Prespawn, 0,-1,0
  - fx_GP_Player, 0,2,2
  poke:
  - self: true
    parameter: ashenExit2
  - self: true
    delay: 4
    parameter: ashenExitRemove
  - prefab: Charred_Melee_Fader, Charred_Melee, Charred_Mage, Charred_Twitcher, Charred_Archer, Charred_Twitcher_Summoned, Skeleton_Hildir, Charred_Archer_Fader
    maxDistance: 100
    maxHeight: 100
    delay: 4
    parameter: ashenMobsRemove

# Aesthetic effects upon Ashengard tower breached
- prefab: Ashlands_Fortress_Gate_Door
  type: poke, ashenExit2
  delay: 3
  spawns:
  - fx_lavabomb_explosion
  - fx_lavabomb_explosion, 2,0,0
  - fx_lavabomb_explosion, -2,0,0
  - fx_lavabomb_explosion, 0,0,2
  - fx_lavabomb_explosion, 0,0,4
  - sfx_unstablerock_explosion
  - sfx_unstablerock_explosion, -2,0,0
  - sfx_unstablerock_explosion, 2,0,0
  - sfx_fader_spawn_meteor_impact
  - sfx_fader_fissure
  - fx_flametalnode_destruction
  - fx_flametalnode_destruction, 0,0,3
  - fx_flametalnode_destruction, 0,0,6
  - fx_FallenValkyrie_projectile_explosion, 0,-2,0
  - vfx_Ash_Arch2_Broken2_destroyed, 0,2,4
  - vfx_Ash_Arch2_Broken2_destroyed, 6,4,9
  - vfx_Ash_Arch2_Broken2_destroyed, -5,6,8
  - troll_summoned_groundslam_aoe, 1,2,0
  commands:
  - setkey ashengard
  - setglobalkey ashengard
  - wait 6000;broadcast center <color=#82e8a4>Ashengard's tower has been breached!
  - wait 7500;broadcast center <color=#82e8a4>Ashengard's tower has been breached!
  - wait 9000;broadcast center <color=#82e8a4>The path to Fader is now open!
  - wait 10500;broadcast center <color=#82e8a4>The path to Fader is now open!

# Remove Ashengard tower gate
- prefab: Ashlands_Fortress_Gate_Door
  type: poke, ashenExitRemove
  remove: true

# Remove monsters upon Ashengard tower breached
- prefab: Charred_Melee_Fader, Charred_Melee, Charred_Mage, Charred_Twitcher, Charred_Archer, Charred_Twitcher_Summoned, Skeleton_Hildir, Charred_Archer_Fader
  type: poke, ashenMobsRemove
  remove: true
  