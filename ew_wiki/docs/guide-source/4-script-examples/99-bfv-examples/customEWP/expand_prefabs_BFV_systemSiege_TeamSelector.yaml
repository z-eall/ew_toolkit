- prefab: vfx_spawn
  type: create
  objects:
  - prefab: MarketPlaceNPC
    filter: string, KGnpcNameOverride, Enter<br>World
    maxDistance: 10
  clientRpc:
  - name: ShowMessage
    1: enum_message, 2
    2: string, Left Team
  keys: <pid>/team
  exec: <clear_<pid>/team>
     
- prefab: ItemDrop
  type: create
  objects:
  - prefab: MarketPlaceNPC
    filter: string, KGnpcNameOverride, Enter<br>World
    maxDistance: 60
  remove: true