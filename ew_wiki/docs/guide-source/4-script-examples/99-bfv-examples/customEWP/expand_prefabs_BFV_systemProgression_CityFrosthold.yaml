# ║ Section - Admin Debug                                     ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
# ═══════════════════════════════════════════════════════════
# Admin Command
# ═══════════════════════════════════════════════════════════
- prefab: Player
  type: say, !fhstage
  admin: true
  cancel: true
  poke:
  - self: true
    parameter: setFrostholdStage <par_1>

# ═══════════════════════════════════════════════════════════
# Set Frosthold Stage 1
# ═══════════════════════════════════════════════════════════
- prefab: Player
  type: poke, setFrostholdStage 1
  fallback: true
  exec: |
    <clear_frostholdtpblocker>
  poke:
  - prefab: dverger_demister_broken
    filters:
    - int, isFrostseerSpawner, 1
    - int, isFrostlordSpawner, 1
    filterLimit: 1
    parameter: respawnFrostholdBoss
  - prefab: piece_shieldgenerator
    filter: int, isFrostholdShieldGenerator, 1
    parameter: resetFrostholdShield
  - prefab: Spawner_Bat
    filters:
    - string, isSpawningPrefab, StoneGolem
    - string, isSpawningPrefab, Ghost
    filterLimit: 1
    maxDistance: 300
    parameter: resetFrostholdRevenants

# Reset Frosthold Revenants Spawn
- prefab: Spawner_Bat
  type: poke, resetFrostholdRevenants
  data: string, CreatureSpawner.m_creaturePrefab, sfx_secretfound
  injectData: false

# Reset Frosthold Shield
- prefab: piece_shieldgenerator
  type: poke, resetFrostholdShield
  data: isFrostholdShieldGeneratorON

# Respawn Frostseer
- prefab: dverger_demister_broken
  type: poke, respawnFrostholdBoss
  filter: int, isFrostseerSpawner, 1
  spawn:
  - prefab: Wraith
    data: frostseerskadir
    pos: 0,0,3
    triggerRules: true

# Respawn Frostlord
- prefab: dverger_demister_broken
  type: poke, respawnFrostholdBoss
  filter: int, isFrostlordSpawner, 1
  spawn:
  - prefab: Charred_Melee_Dyrnwyn
    data: frostlordglacir
    pos: 0,0,-3
    triggerRules: true
  poke:
  - self: true
    delay: 0.1
    parameter: respawnEverfrost

