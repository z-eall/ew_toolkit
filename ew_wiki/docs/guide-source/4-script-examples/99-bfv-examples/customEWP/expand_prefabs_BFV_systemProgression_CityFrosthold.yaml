# ═══════════════════════════════════════════════════════════
# Set Frosthold Stage 2
# ═══════════════════════════════════════════════════════════
- prefab: Player
  type: poke, setFrostholdStage 2
  fallback: true
  poke:
  - prefab: Wraith,Charred_Melee_Dyrnwyn,caverock_ice_pillar_wall,piece_bed02,rock3_ice_frac
    filters:
    - int, frostseerskadir, 1
    - int, frostlordglacir, 1
    - int, isFrostholdEverfrostIce, 1
    - int, isFrostholdEverfrostBed, 1
    - int, isFrostholdPowerstoneBlocker, 1
    filterLimit: 1
    parameter: removeFrostholdBoss
  - prefab: piece_shieldgenerator
    filter: int, isFrostholdShieldGenerator, 1
    delay: 0.1
    parameter: removeFrostholdShield
  - prefab: Spawner_Bat
    filters:
    - string, isSpawningPrefab, StoneGolem
    - string, isSpawningPrefab, Ghost
    filterLimit: 1
    maxDistance: 300
    parameter: stopFrostholdRevenants

# Stop Frosthold Revenants Spawn
- prefab: Spawner_Bat
  type: poke, stopFrostholdRevenants
  data: string, CreatureSpawner.m_creaturePrefab, sfx_bat_idle
  injectData: false

# Remove Frosthold Shield
- prefab: piece_shieldgenerator
  type: poke, removeFrostholdShield
  data: isFrostholdShieldGeneratorOFF

# Remove Frosthold Boss
- prefab: Wraith,Charred_Melee_Dyrnwyn,piece_bed02
  type: poke, removeFrostholdBoss
  remove: true

# Remove Frosthold Boss with delay
- prefab: caverock_ice_pillar_wall,rock3_ice_frac
  type: poke, removeFrostholdBoss
  remove: true
  removeDelay: <randf_0_2>
  spawn:
  - prefab: caverock_ice_wall_destruction
    delay: <randf_0_2>