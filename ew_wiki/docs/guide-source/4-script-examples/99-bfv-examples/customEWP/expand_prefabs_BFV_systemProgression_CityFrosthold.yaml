  filterLimit: 1
  remove: true
  removeDelay: 4

# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Frosthold Shield Generator                      ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
- prefab: piece_shieldgenerator
  type: poke, increaseFrostholdPortalEnergy
  bannedKeys: frostholdtpblocker
  data: float, frostholdPortalEnergy, <add_1_<float_frostholdPortalEnergy=0>>
  triggerRules: true

- prefab: piece_shieldgenerator
  type: change, frostholdPortalEnergy 3;999
  bannedKeys: frostholdtpblocker
  poke:
  - prefab: piece_pot2
    filter: int, isFrostholdSentryChest, 1
    maxDistance: 200
    delay: 3
    parameter: spawnFrostholdPortalChest
  - self: true
    delay: <sealstoneSentryResetTime>
    parameter: resetFrostholdPortalEnergy

- prefab: piece_pot2
  type: poke, spawnFrostholdPortalChest
  spawn:
  - prefab: piece_pot3_red
    data: isFrostholdPortalChest
    pos: 0,0,-0.5
    rot: 180,0,0

- prefab: piece_shieldgenerator
  type: poke, resetFrostholdPortalEnergy
  data: float, frostholdPortalEnergy, 0
  poke:
  - prefab: piece_pot3_red
    filter: int, isFrostholdPortalChest, 1
    maxDistance: 200
    parameter: removeFrostholdPortalChest

- prefab: piece_pot3_red
  type: poke, removeFrostholdPortalChest
  remove: true
  spawn:
  - prefab: fx_DvergerMage_MistileSpawn

