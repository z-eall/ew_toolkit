    parameter: checkPortalChestCooldown <ge_<sub_<time>_<float_sentryCooldown=0>>_<sealstoneSentryCooldown>>

# ═══════════════════════════════════════════════════════════
# If cooldown check false
# ═══════════════════════════════════════════════════════════
- prefab: piece_pot3_red
  type: poke, checkPortalChestCooldown false
  spawn:
  - prefab: fx_guardstone_permitted_removed
    pos: 0,0,-1.5
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <pos>
    3: string, Cooling down in <ceil_<sub_<sealstoneSentryCooldown>_<sub_<time>_<float_sentryCooldown=0>>>> sec.
    4: bool, false

# ═══════════════════════════════════════════════════════════
# If cooldown check true
# ═══════════════════════════════════════════════════════════
- prefab: piece_pot3_red
  type: poke, checkPortalChestCooldown true
  poke:
  - self: true
    parameter: checkPortalChestContent <ge_<item_<sealstonePortalCostItem>>_<sealstonePortalCostAmount>>

# ═══════════════════════════════════════════════════════════
# If cost check false
# ═══════════════════════════════════════════════════════════
- prefab: piece_pot3_red
  type: poke, checkPortalChestContent false
  spawn:
  - prefab: fx_guardstone_permitted_removed
    pos: 0,0,-1.5
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <pos>
    3: string, Needs <sealstonePortalCostAmount> trophy.
    4: bool, false

# ═══════════════════════════════════════════════════════════
# If cost check true
# ═══════════════════════════════════════════════════════════
- prefab: piece_pot3_red
  type: poke, checkPortalChestContent true
  data: float, sentryCooldown, <time>
  removeItems: removeSealstonePortalCost
  injectData: true
  spawn:
  - prefab: fx_guardstone_permitted_add
    pos: 0,0,-1.5
  - prefab: fx_Potion_frostresist
    rot: 0,0,180
  poke:
  - prefab: Player
    filter: long, playerID, <cid>
    maxDistance: 20
    parameter: teleportFrostholdPlayer

# ═══════════════════════════════════════════════════════════
# 
# ═══════════════════════════════════════════════════════════
- prefab: Player
  type: poke, teleportFrostholdPlayer
  objectRpc:
  - name: RPC_TeleportTo
    1: vec, <add_<randi_-2_3>_-286>,<add_<randi_-2_3>_-172>,141
    2: quat, <a>
    3: bool, true
    delay: 1
  - name: Message
    1: enum_message, 2
    2: string, A mystical force pulled you in..
    3: int, 1
    repeat: 2
    repeatInterval: 2
    delay: 5
    overwrite: true

