#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - PVE - Frosthold                                 ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
# ╔═══════════════════════════════════════════════════════════╗
# ║                                                           ║
# ║ Section - Frosthold Sealstone Sentry                      ║
# ║                                                           ║
# ╚═══════════════════════════════════════════════════════════╝
#
- prefab: piece_pot2
  type: change, InUse 0
  filter: int, isFrostholdSentryChest, 1
  poke:
  - self: true
    parameter: checkSentryChestCooldown <ge_<sub_<time>_<float_sentryCooldown=0>>_<sealstoneSentryCooldown>>

# ═══════════════════════════════════════════════════════════
# If cooldown check false
# ═══════════════════════════════════════════════════════════
- prefab: piece_pot2
  type: poke, checkSentryChestCooldown false
  spawn:
  - prefab: fx_guardstone_permitted_removed
    pos: 0,0,-1.5
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <pos>
    3: string, Cooling down in <ceil_<sub_<sealstoneSentryCooldown>_<sub_<time>_<float_sentryCooldown=0>>>> sec.
    4: bool, false

# ═══════════════════════════════════════════════════════════
# If cooldown check true
# ═══════════════════════════════════════════════════════════
- prefab: piece_pot2
  type: poke, checkSentryChestCooldown true
  poke:
  - self: true
    parameter: checkSentryChestContent <ge_<item_<sealstoneSentryCostItem>>_<sealstoneSentryCostAmount>>

# ═══════════════════════════════════════════════════════════
# If cost check false
# ═══════════════════════════════════════════════════════════
- prefab: piece_pot2
  type: poke, checkSentryChestContent false
  spawn:
  - prefab: fx_guardstone_permitted_removed
    pos: 0,0,-1.5
  clientRpc:
  - name: RPC_DamageText
    packaged: true
    target: all
    1: enum_damagetext, 7
    2: vec, <pos>
    3: string, Needs <sealstoneSentryCostAmount> energy.
    4: bool, false

# ═══════════════════════════════════════════════════════════
# If cost check true
# ═══════════════════════════════════════════════════════════
- prefab: piece_pot2
  type: poke, checkSentryChestContent true
  data: float, sentryCooldown, <time>
  removeItems: removeSealstoneSentryCost
  injectData: true
  spawn:
  - prefab: fx_guardstone_permitted_add
    pos: 0,0,-1.5
  - prefab: fx_Potion_frostresist
    rot: 0,0,180
  poke:
  - prefab: Piece_grausten_pillarbeam_small
    filter: int, isFrostholdSentryCannon, 1
    limit: 1
    maxDistance: 10
    delay: 1.5
    parameter: shootSentryLaser
  - prefab: piece_shieldgenerator
    filter: int, isFrostholdShieldGenerator, 1
    limit: 1
    maxDistance: 200
    parameter: increaseFrostholdPortalEnergy

