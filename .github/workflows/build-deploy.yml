name: Build and deploy

# Single combined workflow: regenerate schema, build, and deploy all run as
# steps of the same run. A two-workflow split (schedule regenerates + pushes a
# commit -> a separate `on: push` workflow builds/deploys) would silently
# never fire the second workflow, because the default GITHUB_TOKEN cannot
# trigger another workflow run.
# This design sidesteps that entirely anyway: schema.generated.json is
# gitignored (ticket 12) and never committed, so this workflow has nothing to
# push back to the repo in the first place.
on:
  push:
    branches: [main, cursor/work]
  pull_request: {}
  schedule:
    # Daily. Off-the-hour minute to avoid GitHub's documented queuing delay
    # at the top of every hour.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Landing page and each Tool are separate npm projects with their own
      # lockfiles — install each.
      - run: npm ci
      - name: Install each Tool (list in shared/tools.json)
        run: |
          for tool in $(node -p "require('./shared/tools.json').map(t => t.key).join(' ')"); do
            (cd "$tool" && npm ci)
          done

      - run: npm run typecheck
        working-directory: ewp_validator

      # Regular tests use the saved copy of the mod's docs, so they never fail
      # because of the internet or an upstream edit.
      - run: npm test
        working-directory: ewp_validator

      # Daily run only: the same tests against the mod's live docs. A failure
      # here means "the mod docs changed; update schema/fixtures/RPCs.md and
      # the validator", not "the code broke".
      - name: Upstream docs check (daily run)
        if: github.event_name == 'schedule'
        run: npm run test:upstream
        working-directory: ewp_validator

      # Builds the landing page and every Tool (regenerating
      # ewp_validator/src/schema.generated.json from Jere's manifest.json
      # along the way) and combines them into dist/ for one Pages deploy.
      - run: npm run build:hub

      # The built validator under its hub path: files, workers and fonts exist.
      - run: npm run smoke:hub

      # The landing page and every Tool in a real browser at phone and desktop
      # width: the shared nav bar must look the same on all of them.
      - run: npm run check:look

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Only main deploys. Pull requests and the second branch build and test only.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
